<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karni Pro Login</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f766e,#14b8a6,#2dd4bf);
overflow:hidden;
}

.card{
width:90%;
max-width:420px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:35px;
border-radius:30px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
border:1px solid rgba(255,255,255,.2);
}

.logo{
text-align:center;
font-size:85px;
margin-bottom:10px;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-8px);}
}

.title{
text-align:center;
color:white;
font-size:34px;
font-weight:900;
}

.subtitle{
text-align:center;
color:#ecfeff;
margin-top:10px;
margin-bottom:25px;
font-size:14px;
}

.input-group{
margin-bottom:15px;
}

.input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:15px;
background:rgba(255,255,255,.25);
color:white;
font-size:15px;
}

.input::placeholder{
color:#f1f5f9;
}

.password-box{
position:relative;
}

.eye{
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:22px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:white;
color:#0f766e;
font-size:16px;
font-weight:800;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

#error{
margin-top:15px;
text-align:center;
color:#fff;
font-weight:bold;
min-height:25px;
}

.version{
text-align:center;
margin-top:20px;
color:#ecfeff;
font-size:12px;
}

</style>
</head>
<body>

<div class="card">

<div class="logo">📓</div>

<div class="title">Karni Pro</div>

<div class="subtitle">
نظام إدارة الزبناء والديون
</div>

<div class="input-group">
<input
type="email"
id="email"
class="input"
placeholder="📧 البريد الإلكتروني">
</div>

<div class="password-box">

<input
type="password"
id="password"
class="input"
placeholder="🔑 كلمة المرور">

<span
class="eye"
onclick="togglePassword()">👁️</span>

</div>

<br>

<button onclick="login()">
تسجيل الدخول
</button>

<div id="error"></div>

<div class="version">
Karni Pro Secure Access
</div>

</div>

<script>

if(localStorage.getItem("loggedIn")==="true"){
window.location.href="index.html";
}

function togglePassword(){

const pass=
document.getElementById("password");

pass.type=
pass.type==="password"
? "text"
: "password";

}

function login(){

const email=
document.getElementById("email").value.trim();

const password=
document.getElementById("password").value;

if(
email==="Abdelalihouna@gmail.com" &&
password==="Houna@20272028"
){

localStorage.setItem("loggedIn","true");
localStorage.setItem("appVersion","11");

window.location.href="index.html";

}else{

document.getElementById("error").textContent=
"❌ البريد الإلكتروني أو كلمة المرور غير صحيحة";

}

}

</script>

</body>
</html>
