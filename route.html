<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Karni Pro - المسار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--primary:#0F766E;--primary-light:#14B8A6;--gradient:linear-gradient(135deg,#0F766E 0%,#14B8A6 100%);--bg:#f6fbfb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e6f4f2;--danger:#ef4444;--radius:18px;--shadow:0 6px 24px rgba(15,118,110,0.08);--shadow-lg:0 14px 40px rgba(15,118,110,0.15)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);min-height:100vh;color:var(--text)}
.header{position:sticky;top:0;z-index:90;background:var(--gradient);color:#fff;padding:14px;border-radius:0 0 24px 24px;box-shadow:var(--shadow-lg)}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.header-title{flex:1;text-align:center}
.header-title b{font-size:18px;font-weight:900}
.conn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;margin-top:4px}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px;background:var(--card);margin:12px;border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--border)}
.s-item{text-align:center;padding:6px 2px}
.s-num{font-size:22px;font-weight:900;color:var(--primary)}
.s-label{font-size:9px;font-weight:800;color:var(--muted)}
.view-toggle{display:flex;gap:8px;padding:10px 12px}
.v-btn{flex:1;padding:11px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--muted)}
.v-btn.active{background:var(--gradient);color:#fff;border-color:transparent}
.view{display:none;padding:0 12px 110px}
.view.active{display:block}
.route-card{background:var(--card);padding:12px;border-radius:18px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;border-right:4px solid transparent}
.route-card.current{border-right-color:#2563eb}
.route-card.visited{border-right-color:#9ca3af;opacity:.75}
.route-card.closed{border-right-color:#1f2937;opacity:.65}
.route-card.closed-note{border-right-color:#ef4444}
.route-card.postponed{border-right-color:#f97316}
.r-num{width:44px;height:44px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex-shrink:0}
.r-num.current{background:#2563eb}.r-num.visited{background:#9ca3af}.r-num.closed{background:#1f2937}.r-num.closed-note{background:#ef4444}.r-num.postponed{background:#f97316}.r-num.pending{background:#94a3b8}
.r-info{flex:1;min-width:0}
.r-name{font-size:13px;font-weight:800}
.r-status{font-size:11px;font-weight:700}
.r-status.current{color:#2563eb}.r-status.visited{color:#9ca3af}.r-status.closed{color:#1f2937}.r-status.closed-note{color:#ef4444}.r-status.postponed{color:#f97316}.r-status.pending{color:#94a3b8}
.r-note{font-size:11px;color:#ef4444;margin-top:4px;background:#fef2f2;padding:4px 8px;border-radius:8px}
.r-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.r-actions button{padding:6px 10px;border-radius:10px;border:none;cursor:pointer;font-size:11px;font-weight:800}
.btn-done{background:#dcfce7;color:#166534}.btn-closed{background:#e5e7eb;color:#374151}.btn-note{background:#fee2e2;color:#991b1b}.btn-postpone{background:#ffedd5;color:#9a3412}.btn-del{background:#fff1f2;color:#ef4444;border:1px solid #fecdd3}
.map-wrap{position:relative;width:100%;height:calc(100vh - 230px);overflow:auto;background:linear-gradient(180deg,#0b1727 0%,#10253b 100%);border-radius:18px;margin-top:4px}
.map-content{position:relative;padding-bottom:180px}
.map-bg{position:absolute;width:100%;height:100%;background-image:radial-gradient(#ffffff 1px, transparent 1px),radial-gradient(#60a5fa 1px, transparent 1px);background-size:120px 120px,180px 180px;opacity:.25}
.route-path{position:absolute;top:0;left:0;width:100%;z-index:1;pointer-events:none}
.route-path svg{width:100%;display:block}
.point{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;z-index:10}
.point-label{background:#fff;padding:8px 10px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);font-size:12px;min-width:90px;text-align:center}
.point-dot{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px;border:3px solid #fff}
.point-dot.visited{background:#22c55e}.point-dot.current{background:#2563eb}.point-dot.pending{background:#94a3b8}.point-dot.closed{background:#374151}.point-dot.closed-note{background:#ef4444}.point-dot.postponed{background:#f97316}
.finish-flag{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:20}
.flag{background:#ef4444;color:#fff;padding:8px 16px;border-radius:10px;font-weight:800;font-size:13px}
.house{background:var(--primary);color:#fff;padding:8px 14px;border-radius:10px;font-weight:800;font-size:12px}
.tree{position:absolute;font-size:22px;z-index:2}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal.active{display:flex}
.m-card{background:var(--card);border-radius:20px;padding:16px;width:100%;max-width:340px;box-shadow:var(--shadow-lg)}
.m-title{font-size:14px;font-weight:800;margin-bottom:6px}
.m-desc{font-size:12px;color:var(--muted);margin-bottom:10px}
.m-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#f8fafc;font-size:12px;outline:none;margin-bottom:8px}
.m-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.m-btn{padding:10px;border-radius:12px;border:none;font-weight:800;font-size:11px;cursor:pointer;font-family:'Cairo'}
.m-btn.cancel{background:#f1f5f9;color:var(--muted);border:1px solid var(--border)}
.m-btn.confirm{background:var(--gradient);color:#fff}
.m-btn.danger{background:var(--danger);color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:12px;font-weight:700;z-index:300;transition:.35s}
.toast.show{transform:translateX(-50%) translateY(0)}
.bottom-sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:190;display:none;align-items:flex-end;justify-content:center}
.bottom-sheet.active{display:flex}
.sheet-card{background:var(--card);border-radius:22px 22px 0 0;padding:14px;width:100%;max-width:520px}
.sheet-item{padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:12px}
.sheet-item.danger{color:var(--danger)}
</style>
</head>
<body>
<header class="header">
<div class="header-row">
<button class="h-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-right"></i></button>
<div class="header-title"><b>🗺️ المسار</b><div class="conn" id="connStatus"><span class="dot" id="connDot" style="background:#fbbf24"></span><span id="connText">جاري الاتصال...</span></div></div>
<div style="display:flex;gap:8px">
<button class="h-btn" onclick="window.location.href='Raport.html'"><i class="fas fa-chart-bar"></i></button>
<button class="h-btn" onclick="openSheet()"><i class="fas fa-ellipsis-v"></i></button>
</div>
</div>
</header>
<div class="stats">
<div class="s-item"><div class="s-num" id="totalCount">0</div><div class="s-label">الإجمالي</div></div>
<div class="s-item"><div class="s-num" id="visitedCount">0</div><div class="s-label">تمت زيارته</div></div>
<div class="s-item"><div class="s-num" id="currentCount">0</div><div class="s-label">الحالي</div></div>
<div class="s-item"><div class="s-num" id="pendingCount">0</div><div class="s-label">في الانتظار</div></div>
</div>
<div class="view-toggle">
<button class="v-btn active" id="btnList" onclick="showListView()"><i class="fas fa-list"></i> القائمة</button>
<button class="v-btn" id="btnMap" onclick="showMapView()"><i class="fas fa-map"></i> الخريطة</button>
</div>
<div style="display:flex;justify-content:center;gap:10px;padding:6px 12px;font-size:10px;color:var(--muted);flex-wrap:wrap"><span>🟠 مؤجل</span><span>🔴 ملاحظة</span><span>⚫ مغلق</span><span>⚪ تمت زيارته</span><span>🔵 الحالي</span></div>
<div class="view active" id="listView"><div id="routeList"></div></div>
<div class="view" id="mapView"><div class="map-wrap" id="mapContainer"><div class="map-content" id="mapContent"><div class="map-bg"></div><div class="route-path" id="routePathDiv"><svg id="routeSvg"><path id="routePath" fill="none" stroke="#fff" stroke-width="10" stroke-dasharray="14 12" stroke-linecap="round" opacity="0.9"/></svg></div><div id="pointsContainer"></div><div id="startContainer"></div><div id="treesContainer"></div><div id="finishContainer"></div></div></div></div>
<div class="modal" id="customModal"><div class="m-card"><div class="m-title" id="customTitle">تنبيه</div><div class="m-desc" id="customDesc"></div><input type="text" id="customInput" class="m-input" style="display:none"><div class="m-actions"><button class="m-btn cancel" onclick="closeModal()">إلغاء</button><button class="m-btn confirm" id="customConfirm">تأكيد</button></div></div></div>
<div class="bottom-sheet" id="bottomSheet" onclick="if(event.target.id==='bottomSheet') closeSheet()"><div class="sheet-card"><div style="width:36px;height:4px;background:var(--border);border-radius:10px;margin:0 auto 12px"></div><div class="sheet-item" onclick="closeSheet(); resetRoute()"><i class="fas fa-rotate"></i><div><div style="font-weight:800;font-size:12px">إعادة التعيين</div><div style="font-size:10px;color:var(--muted)">إرجاع الكل إلى في الانتظار</div></div></div><div class="sheet-item" onclick="closeSheet(); syncToday()"><i class="fas fa-arrows-rotate"></i><div><div style="font-weight:800;font-size:12px">مزامنة زبناء اليوم</div></div></div><div class="sheet-item danger" onclick="closeSheet(); clearAll()"><i class="fas fa-trash"></i><div><div style="font-weight:800;font-size:12px">مسح المسار</div></div></div><button class="m-btn cancel" style="width:100%;margin-top:10px" onclick="closeSheet()">إغلاق</button></div></div>
<div class="toast" id="toast"><span id="toastMsg">تم</span></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, set, remove, onValue, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y", authDomain: "karni-b9b34.firebaseapp.com", databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app", projectId: "karni-b9b34", storageBucket: "karni-b9b34.firebasestorage.app", messagingSenderId: "489835094040", appId: "1:489835094040:web:109e20fe7b65516903236d" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
let routeList = []; let draggedItem = null; let currentView='list'; let customCb=null;
const STATUS_AR={pending:'في الانتظار',current:'الحالي',visited:'تمت زيارته',closed:'مغلق','closed-note':'ملاحظة',postponed:'مؤجل'};
function showToast(msg){ const t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
window.showCustomModal=function({title,desc,showInput=false,inputValue='',placeholder='',confirmText='تأكيد',cancelText='إلغاء',danger=false,onConfirm}){ document.getElementById('customTitle').textContent=title; document.getElementById('customDesc').textContent=desc; const inp=document.getElementById('customInput'); inp.style.display=showInput?'block':'none'; if(showInput){ inp.value=inputValue; inp.placeholder=placeholder; } document.getElementById('customConfirm').textContent=confirmText; document.getElementById('customConfirm').className=danger?'m-btn danger':'m-btn confirm'; customCb=onConfirm; document.getElementById('customModal').classList.add('active'); };
window.closeModal=function(){ document.getElementById('customModal').classList.remove('active'); customCb=null; };
document.getElementById('customConfirm').addEventListener('click',()=>{ const val=document.getElementById('customInput').style.display!=='none'?document.getElementById('customInput').value:null; if(customCb) customCb(val); closeModal(); });
document.getElementById('customModal').addEventListener('click',(e)=>{ if(e.target.id==='customModal') closeModal(); });
window.openSheet=function(){ document.getElementById('bottomSheet').classList.add('active'); };
window.closeSheet=function(){ document.getElementById('bottomSheet').classList.remove('active'); };
function setConn(state,text){ document.getElementById('connText').textContent=text; }
function saveToFirebase(){ set(ref(db,'routeManual'),routeList).then(()=>showToast('✅ تم الحفظ')); }
async function checkAndLoadTodayCustomers(){ try{ const today=new Date().toISOString().split('T')[0]; const custSnap=await get(ref(db,'customers')); const routeSnap=await get(ref(db,'routeManual')); let data=routeSnap.exists()?routeSnap.val():[]; if(!custSnap.exists()) return; const customers=custSnap.val(); let added=0; Object.keys(customers).forEach(key=>{ const c=customers[key]; if(c.date===today){ const exists=data.some(item=>item.id===(c.id||key)); if(!exists){ data.push({id:c.id||key,name:c.name,status:'pending',note:''}); added++; } } }); if(added>0){ await set(ref(db,'routeManual'),data); showToast('➕ تمت إضافة '+added+' زبون'); } }catch(e){} }
window.syncToday=function(){ checkAndLoadTodayCustomers(); };
setConn('wait','جاري الاتصال...'); checkAndLoadTodayCustomers(); setInterval(checkAndLoadTodayCustomers,30000);
onValue(ref(db,'routeManual'),(snap)=>{ routeList=snap.exists()?snap.val():[]; if(!Array.isArray(routeList)) routeList=Object.values(routeList); renderAll(); setConn('online','متصل'); });
function renderAll(){ renderStats(); renderList(); renderMap(); }
function renderStats(){ let pending=0,current=0,visited=0; routeList.forEach(item=>{ if(item.status==='pending') pending++; if(item.status==='current') current++; if(item.status==='visited') visited++; }); document.getElementById('totalCount').innerText=routeList.length; document.getElementById('visitedCount').innerText=visited; document.getElementById('currentCount').innerText=current; document.getElementById('pendingCount').innerText=pending; }
function renderList(){ const container=document.getElementById('routeList'); if(routeList.length===0){ container.innerHTML='<div style="text-align:center;padding:50px;color:#999;background:#fff;border-radius:18px">المسار فارغ<br><span style="font-size:11px">سيتم إضافة زبناء اليوم تلقائيا</span></div>'; return; } let html=''; let pending=0,current=0; routeList.forEach((item,index)=>{ if(item.status==='pending') pending++; if(item.status==='current') current++; if(pending>0 && item.status==='pending' && current===0){ item.status='current'; current=1; pending--; } const ar=STATUS_AR[item.status]||item.status; html+=`<div class="route-card ${item.status}" draggable="true" data-index="${index}" onclick="window.location.href='person.html?id=${item.id}'"><div style="font-size:18px;color:#d1d5db">⋮⋮</div><div class="r-num ${item.status}">${index+1}</div><div class="r-info"><div class="r-name">${item.name}</div><div class="r-status ${item.status}">${ar}</div>${item.note?`<div class="r-note">✏️ ${item.note}</div>`:''}<div class="r-actions">${item.status!=='visited'?`<button class="btn-done" onclick="event.stopPropagation();markDone('${item.id}')">✅ تم</button>`:''}<button class="btn-closed" onclick="event.stopPropagation();markClosed('${item.id}')">مغلق</button><button class="btn-note" onclick="event.stopPropagation();addNote('${item.id}')">✏️ رسالة</button><button class="btn-postpone" onclick="event.stopPropagation();postpone('${item.id}')">تأجيل</button><button class="btn-del" onclick="event.stopPropagation();deleteCustomer('${item.id}')">🗑️</button></div></div></div>`; }); container.innerHTML=html; document.querySelectorAll('.route-card').forEach(card=>{ card.addEventListener('dragstart',e=>{ draggedItem=e.currentTarget; e.currentTarget.style.opacity='0.5'; }); card.addEventListener('dragend',e=>{ e.currentTarget.style.opacity='1'; }); card.addEventListener('dragover',e=>e.preventDefault()); card.addEventListener('drop',e=>{ e.preventDefault(); if(draggedItem && draggedItem!==e.currentTarget){ let from=parseInt(draggedItem.dataset.index); let to=parseInt(e.currentTarget.dataset.index); let it=routeList.splice(from,1)[0]; routeList.splice(to,0,it); saveToFirebase(); } }); }); }
function renderMap(){ const container=document.getElementById('pointsContainer'); const startC=document.getElementById('startContainer'); const treesC=document.getElementById('treesContainer'); const finishC=document.getElementById('finishContainer'); const mapContent=document.getElementById('mapContent'); const pathDiv=document.getElementById('routePathDiv'); const svg=document.getElementById('routeSvg'); const path=document.getElementById('routePath'); container.innerHTML=''; startC.innerHTML=''; treesC.innerHTML=''; finishC.innerHTML=''; if(routeList.length===0){ path.setAttribute('d',''); mapContent.style.height='400px'; pathDiv.style.height='400px'; svg.setAttribute('height','400'); return; } let points=[]; let h=130; let total=(routeList.length*h)+350; mapContent.style.height=total+'px'; pathDiv.style.height=total+'px'; svg.setAttribute('height',total); let width=document.getElementById('mapContainer').offsetWidth||360; routeList.forEach((item,i)=>{ let y=100+(i*h); let x=width/2+Math.sin(i*0.9)*(width*0.28); points.push({x,y}); }); for(let i=0;i<points.length;i++){ const p=points[i]; treesC.innerHTML+=`<div class="tree" style="top:${p.y-40}px;left:${p.x-170}px">🌳</div><div class="tree" style="top:${p.y+40}px;left:${p.x+160}px">🌲</div>`; } if(points.length>1){ let first=points[0]; startC.innerHTML=`<div class="house" style="position:absolute;top:${first.y-40}px;left:${first.x}px;transform:translate(-50%,-50%)">🏠 البداية</div>`; let d=`M ${points[0].x} ${points[0].y}`; for(let i=1;i<points.length;i++){ let cp=(points[i-1].x+points[i].x)/2; d+=` Q ${cp} ${points[i-1].y+55}, ${points[i].x} ${points[i].y}`; } let last=points[points.length-1]; d+=` L ${last.x} ${last.y+150}`; path.setAttribute('d',d); } routeList.forEach((item,i)=>{ let p=points[i]; let ar=STATUS_AR[item.status]||item.status; let left=i%2===0; container.innerHTML+=`<div class="point" style="top:${p.y}px;left:${p.x}px;flex-direction:${left?'row-reverse':'row'}"><div class="point-dot ${item.status}">${i+1}</div><div class="point-label"><div style="font-weight:800;font-size:12px">${item.name}</div><div class="point-status ${item.status}" style="font-size:10px">${ar}</div></div></div>`; }); if(points.length>0){ let last=points[points.length-1]; finishC.innerHTML=`<div class="finish-flag" style="top:${last.y+170}px;left:${last.x}px"><div class="flag">🏁 النهاية</div></div>`; } }
window.showListView=function(){ currentView='list'; document.getElementById('listView').classList.add('active'); document.getElementById('mapView').classList.remove('active'); document.getElementById('btnList').classList.add('active'); document.getElementById('btnMap').classList.remove('active'); };
window.showMapView=function(){ currentView='map'; document.getElementById('mapView').classList.add('active'); document.getElementById('listView').classList.remove('active'); document.getElementById('btnMap').classList.add('active'); document.getElementById('btnList').classList.remove('active'); setTimeout(()=>renderMap(),100); };
window.markDone=function(id){ let i=routeList.findIndex(c=>c.id===id); if(i!==-1){ routeList[i].status='visited'; saveToFirebase(); } };
window.markClosed=function(id){ let i=routeList.findIndex(c=>c.id===id); if(i!==-1){ routeList[i].status='closed'; routeList[i].note=''; saveToFirebase(); } };
window.addNote=function(id){ showCustomModal({title:'إضافة ملاحظة',desc:'اكتب رسالة',showInput:true,placeholder:'مثال: مغلق، تأجيل...',confirmText:'حفظ',onConfirm:(note)=>{ if(note&&note.trim()){ let i=routeList.findIndex(c=>c.id===id); if(i!==-1){ routeList[i].status='closed-note'; routeList[i].note=note.trim(); saveToFirebase(); } } }}); };
window.postpone=function(id){ let i=routeList.findIndex(c=>c.id===id); if(i!==-1){ let c=routeList.splice(i,1)[0]; c.status='postponed'; routeList.push(c); saveToFirebase(); showToast('⏩ تم التأجيل'); } };
window.deleteCustomer=function(id){ showCustomModal({title:'حذف الزبون',desc:'هل تريد حذف هذا الزبون من المسار؟',confirmText:'حذف',danger:true,onConfirm:()=>{ routeList=routeList.filter(c=>c.id!==id); saveToFirebase(); showToast('🗑️ تم الحذف'); }}); };
window.resetRoute=function(){ showCustomModal({title:'إعادة التعيين',desc:'إرجاع الكل إلى في الانتظار؟',confirmText:'إعادة تعيين',onConfirm:()=>{ routeList.forEach(c=>{ c.status='pending'; c.note=''; }); saveToFirebase(); showToast('🔄 تمت إعادة التعيين'); }}); };
