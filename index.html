    <style>
        /* ========== Variables ========== */
        :root {
            --primary: #0f766e;
            --primary-light: #14b8a6;
            --gradient: linear-gradient(135deg, #0f766e 0%, #14b8a6 50%, #2dd4bf 100%);
            --accent: #3b82f6;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #22c55e;
            --bg: #f0fdfd;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #ccfbf1;
            --shadow-md: 0 4px 15px rgba(15, 118, 110, 0.1);
            --shadow-lg: 0 10px 30px rgba(15, 118, 110, 0.15);
            --radius: 18px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow-md: 0 4px 15px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 120px;
            transition: var(--transition);
            font-weight: 500;
        }

        /* ========== Header ========== */
     .header {
            background: var(--gradient);
            color: white;
            padding: 35px 20px 25px;
            text-align: center;
            border-radius: 0 0 35px 35px;
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

     .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

     .header h1 {
            font-size: 34px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

     .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

     .icon-btn:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.3);
        }

     .sync-status {
            background: rgba(255,255,255,0.25);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
        }

     .sync-status.online i {
            color: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        /* ========== Stats ========== */
     .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding: 24px 20px 10px;
        }

     .stat-card {
            background: var(--card);
            padding: 24px 15px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: var(--transition);
            cursor: pointer;
        }

     .stat-card:active {
            transform: scale(0.96);
        }

     .stat-number {
            font-size: 30px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 6px;
        }

     .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* ========== Action Buttons ========== */
     .actions-row {
            padding: 15px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

     .action-btn {
            background: var(--card);
            border: 2px solid var(--border);
            padding: 16px 14px;
            border-radius: var(--radius);
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            color: var(--text);
            box-shadow: var(--shadow-md);
        }

     .action-btn.primary {
            background: var(--gradient);
            color: white;
            border-color: transparent;
        }

     .action-btn:active {
            transform: scale(0.95);
        }

     .action-btn i {
            font-size: 20px;
        }

        /* ========== Search ========== */
     .search-box {
            margin: 0 20px 15px;
            background: var(--card);
            padding: 14px 18px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid var(--border);
        }

     .search-box input {
            border: none;
            outline: none;
            flex: 1;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            background: transparent;
            color: var(--text);
        }


        /* ========== Search Suggestions - NEW ========== */
     .search-wrapper {
            position: relative;
            margin: 0 20px 15px;
        }
     .search-wrapper .search-box {
            margin: 0;
        }
     .search-suggestions {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow-lg);
            max-height: 380px;
            overflow-y: auto;
            z-index: 500;
            display: none;
            animation: slideUp 0.25s ease-out;
        }
     .search-suggestions.active {
            display: block;
        }
     .suggestion-item {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: var(--transition);
        }
     .suggestion-item:last-child {
            border-bottom: none;
        }
     .suggestion-item:hover {
            background: var(--bg);
        }
     .suggestion-item:active {
            transform: scale(0.98);
            background: var(--bg);
        }
     .suggestion-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            flex-shrink: 0;
        }
        [data-theme="dark"] .suggestion-avatar {
            background: linear-gradient(135deg, #334155 0%, #475569 100%);
        }
     .suggestion-info {
            flex: 1;
            min-width: 0;
        }
     .suggestion-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }
     .suggestion-amount {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }
     .suggestion-empty {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 14px;
        }

        /* ========== Filter Tabs ========== */
     .filter-tabs {
            display: flex;
            gap: 8px;
            padding: 15px 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }

     .filter-tabs::-webkit-scrollbar {
            display: none;
        }

     .filter-tab {
            background: var(--card);
            border: 2px solid var(--border);
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            color: var(--text-muted);
        }

     .filter-tab.active {
            background: var(--gradient);
            color: white;
            border-color: transparent;
        }

        /* ========== Customer Cards ========== */
     .customers-list {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

     .customer-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: var(--transition);
            cursor: pointer;
            animation: slideUp 0.4s ease-out backwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

     .customer-card:active {
            transform: scale(0.98);
        }

     .customer-card.overdue {
            border-right: 5px solid var(--danger);
        }

     .customer-header {
            display: flex;
            gap: 14px;
            margin-bottom: 12px;
        }

     .customer-avatar {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
        }

     .customer-info {
            flex: 1;
        }

     .customer-name {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 4px;
        }

     .customer-amount {
            font-size: 22px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 8px;
        }

     .customer-meta {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: var(--text-muted);
        }

     .customer-actions {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
}
     .btn-calendar {
            background: linear-gradient(135deg, #14b8a6 0%, #0f766e 100%);
            color: white;
        }
        
     .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--transition);
        }

     .btn:active {
            transform: scale(0.95);
        }

     .btn-profile {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

     .btn-collect {
            background: linear-gradient(135deg, var(--success) 0%, #16a34a 100%);
            color: white;
        }

     .btn-delete {
    background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
    color: white;
}

.btn-edit-name{
    background:linear-gradient(135deg,#f59e0b 0%,#ea580c 100%);
    color:white;
}

.btn-edit-amount{
    background:linear-gradient(135deg,#22c55e 0%,#15803d 100%);
    color:white;
}

.btn-edit-phone{
    background:linear-gradient(135deg,#06b6d4 0%,#2563eb 100%);

        /* ========== FAB ========== */
     .fab {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: var(--gradient);
            color: white;
            border: none;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(15, 118, 110, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: var(--transition);
        }

     .fab:active {
            transform: scale(0.9);
        }

        /* ========== Modal ========== */
     .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

     .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

     .modal-content {
            background: var(--card);
            border-radius: 25px;
            padding: 30px 25px;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-lg);
            animation: slideUpModal 0.3s;
        }

        @keyframes slideUpModal {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

     .form-group {
            margin-bottom: 20px;
        }

     .form-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

     .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            background: var(--bg);
            color: var(--text);
        }

     .form-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 25px;
        }

     .btn-save {
            background: var(--gradient);
            color: white;
        }

     .btn-cancel {
            background: var(--bg);
            color: var(--text-muted);
            border: 2px solid var(--border);
        }

        /* ========== Toast ========== */
     .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-150px);
            background: var(--card);
            padding: 14px 20px;
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            z-index: 2000;
            transition: transform 0.3s;
        }

     .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ========== Empty State ========== */
     .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

     .empty-icon {
            font-size: 64px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        /* ========== Responsive ========== */
        @media (max-width: 380px) {
         .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (min-width: 768px) {
            body {
                max-width: 600px;
                margin: 0 auto;
            }
        }

        /* ========== 300 سطر CSS إضافي للدارك مود والأنيميشن ========== */
        /*...*/
    
        /* ========== City Select - NEW ========== */
     .city-select-wrapper {
            position: relative;
            width: 100%;
        }
     .city-select-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-align: right;
        }
     .city-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            max-height: 220px;
            overflow-y: auto;
            z-index: 1001;
            display: none;
        }
     .city-dropdown.active {
            display: block;
            animation: slideUp 0.2s ease-out;
        }
     .city-option {
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            transition: var(--transition);
        }
     .city-option:last-child { border-bottom: none; }
     .city-option:hover { background: var(--bg); }
     .city-option.selected { background: var(--primary); color: white; }

        /* City badge in card */
     .city-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
            color: #00695c;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 800;
        }
        [data-theme="dark"] .city-badge {
            background: linear-gradient(135deg, #1e3a3a 0%, #2a5555 100%);
            color: #4ade80;
        }

        /* City filter modal */
     .city-filter-item {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: var(--transition);
            font-weight: 700;
        }
     .city-filter-item:hover { background: var(--bg); }
     .city-filter-item.active-city { background: var(--gradient); color: white; }
     .city-count {
            background: var(--bg);
            color: var(--text-muted);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
        }
     .city-filter-item.active-city .city-count { background: rgba(255,255,255,0.25); color: white; }

    </style>
</head>

    <header class="header">

    <button class="icon-btn" onclick="toggleTheme()" title="تبديل الوضع">

    </button>

    <h1><span>📓</span> Karni Pro</h1>

    <button class="icon-btn"
onclick="openReportsPage()"
title="التقارير">
    <i class="fas fa-chart-bar"></i>
</button>

</div>
        <div class="sync-status online" id="syncStatus">
            <i class="fas fa-circle"></i> جاري الاتصال بـ Firebase...
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number"><span id="totalAmount">0</span> درهم</div>
            <div class="stat-label">💰 المبلغ الإجمالي</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalCustomers">0</div>
            <div class="stat-label">👥 الزبناء</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="overdueCount">0</div>
            <div class="stat-label">🔴 متأخر</div>

        <div class="stat-card">
            <div class="stat-number" id="todayCount">0</div>
            <div class="stat-label">🟢 اليوم</div>

    <!-- الأزرار المطلوبة -->
  <div class="actions-row">

    <div class="search-wrapper" id="searchWrapper">

            <input type="text" placeholder="ابحث عن زبون..." id="searchInput" autocomplete="off">

        </div>
        <div class="search-suggestions" id="searchSuggestions"></div>
    </div>

    <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterBy('all')">الكل</button>
        <button class="filter-tab" onclick="filterBy('today')">اليوم</button>

    </div>

    <div class="customers-list" id="customersList">

    <button class="fab" onclick="showAddModal()">+</button>


    <div class="modal" id="cityFilterModal">
        <div class="modal-content">
            <h3 style="margin-bottom:20px; font-size:22px; display:flex; align-items:center; gap:8px;"><i class="fas fa-city" style="color:var(--primary)"></i> اختر المدينة</h3>
            <div id="cityFilterList" style="max-height:350px; overflow-y:auto; border:2px solid var(--border); border-radius:14px;"></div>
            <div class="form-buttons" style="margin-top:15px;">
                <button class="btn btn-save" onclick="filterByCity('all')"><i class="fas fa-sync"></i> 🔄 All - الكل</button>
                <button class="btn btn-cancel" onclick="closeCityFilter()"><i class="fas fa-times"></i> إغلاق</button>
            </div>
        </div>
    </div>

    <div class="modal" id="customerModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px; font-size: 22px;">إضافة زبون جديد</h3>
            <form id="customerForm" onsubmit="saveCustomer(event)">
                <input type="hidden" id="customerId">

    <script type="module">
        // Firebase Configuration
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue, set, push, remove, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
        const customersRef = ref(db, 'customers');
        let allCustomers = {};
let currentFilter = 'all';
let searchTimer;
let currentCityFilter = 'all';

        // ========== Cities System - NEW ==========
        const DEFAULT_CITIES = ["Gulmim", "TanTan", "Toronto", "ouatia"];
        function getAllCities(){
            const set = new Set(DEFAULT_CITIES);
            Object.values(allCustomers).forEach(c=>{
                if(c.city && c.city.trim()) set.add(c.city.trim());
            });
            return Array.from(set).sort((a,b)=> a.localeCompare(b));
        }
        function getCityCounts(){
            const counts = {};
            getAllCities().forEach(city=> counts[city]=0);
            Object.values(allCustomers).forEach(c=>{
                const city = (c.city||'').trim();
                if(city && counts.hasOwnProperty(city)) counts[city]++;
                else if(city) counts[city]=(counts[city]||0)+1;
            });
            return counts;
        }


        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
    loadTheme();
    setTodayDate();
    initFirebase();

    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearSearch');
    const wrapper = document.getElementById('searchWrapper');

    searchInput.addEventListener('input', function(){
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            searchCustomer();
        }, 150);
    });

    searchInput.addEventListener('focus', function(){
        if(this.value.trim()) showSuggestions(this.value);
    });

    clearBtn.addEventListener('click', function(){
        searchInput.value='';
        hideSuggestions();
        applyFilter(currentFilter);
        searchInput.focus();
        this.style.display='none';
    });

    document.addEventListener('click', function(e){
        if(!wrapper.contains(e.target)){
            hideSuggestions();
        }
        const cityWrapper = document.querySelector('.city-select-wrapper');
        const cityDropdown = document.getElementById('cityDropdownAdd');
        if(cityWrapper && cityDropdown && !cityWrapper.contains(e.target)){
            cityDropdown.classList.remove('active');
        }
        const cityModal = document.getElementById('cityFilterModal');
        if(e.target === cityModal){
            closeCityFilter();
        }
    });
});

        function initFirebase() {
            onValue(customersRef, (snapshot) => {
                const data = snapshot.val();
                allCustomers = data || {};
                applyFilter(currentFilter);
                document.getElementById('syncStatus').innerHTML = '<i class="fas fa-circle" style="color: #4ade80"></i> متصل بـ Firebase';
            }, (error) => {
                console.error(error);
                document.getElementById('syncStatus').innerHTML = '<i class="fas fa-circle" style="color: #ef4444"></i> غير متصل';
            });
        }

        // ========== Navigation Functions ==========

        // 1. زر Calendar - يوري الناس اللي خاصهم يخلصو
        window.openCalendar = function() {
            currentFilter = 'today';
            applyFilter('today');
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.filter-tab')[1].classList.add('active');
            showToast('عرض زبناء اليوم');
            window.scrollTo({top: 300, behavior: 'smooth'});
        }

        // 2. زر Route - يحول مباشرة لـ route.html
        window.openRoute = function() {
            window.location.href = 'route.html';
        }

        // 3. الضغط على زبون - يحول لـ person.html
        window.viewCustomer = function(id) {
            localStorage.setItem('customerId', id);
            window.location.href = 'person.html';
        }

        // ========== CRUD Functions ==========
        async function addCustomer(customerData) {
            const newRef = push(customersRef);
            await set(newRef, {
              ...customerData,
                id: newRef.key,
                createdAt: new Date().toISOString(),
                status: 'pending',
                collected: 0
            });
            showToast('تم إضافة الزبون بنجاح');
        }

        async function updateCustomer(id, data) {
            await update(ref(db, 'customers/' + id), data);
            showToast('تم التحديث');
        }

        async function deleteCustomer(id) {
            await remove(ref(db, 'customers/' + id));
            showToast('تم الحذف');
        }

        // ========== حساب المبلغ الحقيقي - نفس منطق person.html ==========
        function getCustomerRealTotal(customer){
            const base = parseFloat(customer.amount) || 0;
            let totalPaid = 0;
            let totalReceived = 0;
            const ops = customer.operations || [];
            // ops قد تكون object أو array - نوحدها
            const opsArray = Array.isArray(ops) ? ops : Object.values(ops);
            opsArray.forEach(op=>{
                if(!op) return;
                const amt = Number(op.amount) || 0;
                if(op.type === 'paid') totalPaid += amt;
                if(op.type === 'received') totalReceived += amt;
            });
            // القاعدة من person.html: الإجمالي = الأساسي + دفع - استلام
            return Math.round(base + totalPaid - totalReceived);
        }

        // ========== Render Functions ==========
        function renderCustomers(customers) {
            const list = document.getElementById('customersList');
            list.innerHTML = '';

            if(!customers || Object.keys(customers).length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">👥</div>
                        <p>لا توجد زبناء</p>
                        <p style="font-size: 13px;">اضغط + لإضافة زبون</p>
                    </div>
                `;
                updateStats({});
                return;
            }

            let totalAmount = 0;
            let customersCount = 0;
            let todayCount = 0;
            let overdueCount = 0;
            const today = new Date().toISOString().split('T')[0];

            Object.keys(customers).forEach((key, index) => {
                const customer = customers[key];
                const realTotal = getCustomerRealTotal(customer);
                customersCount++;
                totalAmount += realTotal;

                const custDate = customer.date || customer.paymentDate || '';
                if(custDate === today) todayCount++;
                else if(custDate && custDate < today) overdueCount++;

                const overdueClass = custDate && custDate < today ? 'overdue' : '';

                const cityDisplay = customer.city ? customer.city : 'Select City';
                const cityIcon = customer.city ? '🏙️' : '📍';
                const card = `
                    <div class="customer-card ${overdueClass}" onclick="openDetails('${key}')" style="animation-delay: ${index * 0.05}s">
                        <div class="customer-header">
                            <div class="customer-avatar">${(customer.name||'?').charAt(0).toUpperCase()}</div>
                            <div class="customer-info">
                                <div class="customer-name">${customer.name||'بدون اسم'}</div>
                                <div class="customer-amount">${realTotal} درهم</div>
                                <div class="customer-meta">
                                    <span><i class="fas fa-phone"></i> ${customer.phone || '-'}</span>
                                    <span><i class="fas fa-calendar"></i> ${custDate || '-'}</span>
                                </div>
                                <div class="customer-meta" style="margin-top:6px;">
                                    <span class="city-badge">${cityIcon} ${cityDisplay}</span>
                                </div>
                            </div>
                        </div>
                        <div class="customer-actions">

<button class="btn btn-profile"
onclick="event.stopPropagation(); openDetails('${key}')">
<i class="fas fa-user"></i> التفاصيل
</button>

<button class="btn btn-edit-phone"
onclick="event.stopPropagation(); editCustomerPhone('${key}')">
    <i class="fas fa-phone"></i>
</button>

<button class="btn btn-edit-amount"
onclick="event.stopPropagation(); editCustomerAmount('${key}')">
    <i class="fas fa-money-bill-wave"></i>
</button>

<button class="btn btn-calendar"
onclick="event.stopPropagation(); setPaymentDate('${key}')">
<i class="fas fa-calendar-alt"></i>
</button>

<button class="btn btn-delete"
onclick="event.stopPropagation(); confirmDelete('${key}')">
<i class="fas fa-trash"></i>
</button>

                        </div>
                    </div>
                `;
                list.innerHTML += card;
            });

            updateStats({totalAmount, customersCount, todayCount, overdueCount});
        }

        function updateStats(stats) {
            document.getElementById('totalAmount').textContent = stats.totalAmount || 0;
            document.getElementById('totalCustomers').textContent = stats.customersCount || 0;
            document.getElementById('todayCount').textContent = stats.todayCount || 0;
            document.getElementById('overdueCount').textContent = stats.overdueCount || 0;
        }

        // ========== Modal Functions ==========
        window.showAddModal = function() {
            document.getElementById('customerId').value = '';
            document.getElementById('customerName').value = '';
            document.getElementById('customerAmount').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('customerCity').value = '';
            document.getElementById('citySelectText').textContent = 'اختر المدينة';
            document.getElementById('cityDropdownAdd').classList.remove('active');
            setTodayDate();
            document.getElementById('customerModal').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('customerModal').classList.remove('active');
            document.getElementById('cityDropdownAdd')?.classList.remove('active');
        }

        window.saveCustomer = async function(e) {
            e.preventDefault();
            const id = document.getElementById('customerId').value;
            const cityVal = document.getElementById('customerCity').value || '';
            const data = {
                name: document.getElementById('customerName').value,
                amount: parseInt(document.getElementById('customerAmount').value),
                phone: document.getElementById('customerPhone').value,
                city: cityVal,
                date: document.getElementById('customerDate').value,
                paymentDate: document.getElementById('customerDate').value,
                updatedAt: new Date().toISOString()
            };

            if(id) await updateCustomer(id, data);
            else await addCustomer(data);
            closeModal();
        }

        window.collectMoney = async function(id) {
            const amount = prompt('المبلغ المحصل:');
            if(amount) await updateCustomer(id, {collected: parseInt(amount), status: 'collected'});
        }

        window.confirmDelete = function(id) {
            if(confirm('متأكد من الحذف؟')) deleteCustomer(id);
        }

        // ========== Filter & Search ==========
        window.filterBy = function(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            hideSuggestions();
            applyFilter(filter);
        }

        function applyFilter(filter) {
            const filtered = {};
            const today = new Date().toISOString().split('T')[0];

            Object.keys(allCustomers).forEach(key => {
                const customer = allCustomers[key];
                const custDate = customer.date || customer.paymentDate || '';
                if(filter === 'all') filtered[key] = customer;
                else if(filter === 'today' && custDate === today) filtered[key] = customer;
                else if(filter === 'overdue' && custDate && custDate < today) filtered[key] = customer;
                else if(filter === 'upcoming' && custDate && custDate > today) filtered[key] = customer;
            });

            renderCustomers(filtered);
        }

        function hideSuggestions(){
            const box = document.getElementById('searchSuggestions');
            if(box){ box.classList.remove('active'); box.innerHTML=''; }
            const clearBtn = document.getElementById('clearSearch');
            if(clearBtn && !document.getElementById('searchInput').value) clearBtn.style.display='none';
        }

        function showSuggestions(query){
            const box = document.getElementById('searchSuggestions');
            const input = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearSearch');
            if(!box || !input) return;

            const q = query.trim().toLowerCase();
            if(!q){
                hideSuggestions();
                clearBtn.style.display='none';
                applyFilter(currentFilter);
                return;
            }
            clearBtn.style.display='block';

            const matches = Object.entries(allCustomers).filter(([k,c])=>{
                const name = (c.name||'').toLowerCase();
                return name.includes(q);
            });

            if(matches.length === 0){
                box.innerHTML = `<div class="suggestion-empty">🔍 لا توجد نتائج لـ "${query}"</div>`;
                box.classList.add('active');
                // ايضا فلترة القائمة الرئيسية فارغة
                renderCustomers({});
                return;
            }

            // ترتيب: اللي يبدأ بالحرف أولا
            matches.sort((a,b)=>{
                const an = (a[1].name||'').toLowerCase();
                const bn = (b[1].name||'').toLowerCase();
                const aStarts = an.startsWith(q) ? 0 : 1;
                const bStarts = bn.startsWith(q) ? 0 : 1;
                if(aStarts!==bStarts) return aStarts-bStarts;
                return an.localeCompare(bn);
            });

            box.innerHTML = matches.slice(0,20).map(([key,c])=>{
                const realTotal = getCustomerRealTotal(c);
                const initial = (c.name||'?').charAt(0).toUpperCase();
                const safeName = (c.name||'بدون اسم').replace(/</g,'&lt;');
                return `
                <div class="suggestion-item" onclick="openDetails('${key}')">
                    <div class="suggestion-avatar">${initial}</div>
                    <div class="suggestion-info">
                        <div class="suggestion-name">${safeName}</div>
                        <div class="suggestion-amount">${realTotal} Amount</div>
                    </div>
                    <i class="fas fa-chevron-left" style="color: var(--text-muted); font-size:12px;"></i>
                </div>`;
            }).join('');

            box.classList.add('active');

            // كذلك فلترة القائمة الرئيسية Live
            const filtered = {};
            matches.forEach(([k,c])=> filtered[k]=c);
            renderCustomers(filtered);
        }

        window.searchCustomer = function() {
            const search = document.getElementById('searchInput').value;
            showSuggestions(search);
        }

        // ========== Theme Functions ==========
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeIcon').className = savedTheme === 'dark'? 'fas fa-sun' : 'fas fa-moon';
        }

        window.toggleTheme = function() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark'? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('themeIcon').className = newTheme === 'dark'? 'fas fa-sun' : 'fas fa-moon';
        }

        function setTodayDate() {
            document.getElementById('customerDate').value = new Date().toISOString().split('T')[0];
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ========== City Dropdown Logic ==========
        window.toggleCityDropdown = function(context){
            const dropdownId = context === 'add' ? 'cityDropdownAdd' : 'cityDropdownAdd';
            const dropdown = document.getElementById(dropdownId);
            if(!dropdown) return;
            if(dropdown.classList.contains('active')){
                dropdown.classList.remove('active');
                return;
            }
            const cities = getAllCities();
            const currentCity = document.getElementById('customerCity').value;
            dropdown.innerHTML = cities.map(city=>`
                <div class="city-option ${city===currentCity?'selected':''}" onclick="selectCity('${city.replace(/'/g, "\'")}', 'add')">
                    <span><i class="fas fa-map-marker-alt"></i> ${city}</span>
                    ${city===currentCity?'<i class="fas fa-check"></i>':''}
                </div>
            `).join('');
            dropdown.classList.add('active');
        }

        window.selectCity = function(city, context){
            document.getElementById('customerCity').value = city;
            document.getElementById('citySelectText').textContent = city;
            document.getElementById('cityDropdownAdd').classList.remove('active');
        }

        window.openCityFilter = function(){
            const listDiv = document.getElementById('cityFilterList');
            const counts = getCityCounts();
            const cities = Object.keys(counts).sort((a,b)=> counts[b]-counts[a] || a.localeCompare(b));
            const totalAll = Object.keys(allCustomers).length;

            let html = `
                <div class="city-filter-item ${currentCityFilter==='all'?'active-city':''}" onclick="filterByCity('all')">
                    <span><i class="fas fa-globe"></i> All - الكل</span>
                    <span class="city-count">${totalAll}</span>
                </div>
            `;
            html += cities.map(city=>`
                <div class="city-filter-item ${currentCityFilter===city?'active-city':''}" onclick="filterByCity('${city.replace(/'/g, "\'")}')">
                    <span><i class="fas fa-city"></i> ${city}</span>
                    <span class="city-count">${counts[city]||0}</span>
                </div>
            `).join('');

            if(cities.length===0){
                html += '<div class="suggestion-empty">لا توجد مدن بعد</div>';
            }

            listDiv.innerHTML = html;
            document.getElementById('cityFilterModal').classList.add('active');
        }

        window.closeCityFilter = function(){
            document.getElementById('cityFilterModal').classList.remove('active');
        }

        window.filterByCity = function(city){
            currentCityFilter = city;
            closeCityFilter();
            document.querySelectorAll('.filter-tab').forEach(tab=> tab.classList.remove('active'));
            // keep city tab active visually
            const tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(t=>{ if(t.textContent.includes('المدينة')) t.classList.add('active'); });

            if(city==='all'){
                currentFilter='all';
                document.querySelectorAll('.filter-tab')[0].classList.add('active');
                tabs.forEach(t=>{ if(t.textContent.includes('المدينة')) t.classList.remove('active'); });
                applyFilter('all');
                showToast('عرض جميع المدن');
                return;
            }

            const filtered = {};
            Object.keys(allCustomers).forEach(key=>{
                const c = allCustomers[key];
                if((c.city||'').trim().toLowerCase() === city.toLowerCase()){
                    filtered[key]=c;
                }
            });
            renderCustomers(filtered);
            showToast(`مدينة ${city} - ${Object.keys(filtered).length} زبون`);
        }
