<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<title>Karni Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--primary:#0f766e;--primary-light:#14b8a6;--gradient:linear-gradient(135deg,#0f766e 0%,#14b8a6 100%);--bg:#f6fbfb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e6f4f2;--danger:#ef4444;--radius:22px;--shadow:0 6px 24px rgba(15,118,110,0.07);--shadow-lg:0 12px 36px rgba(15,118,110,0.14)}
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--border:#243a3a;--shadow:0 6px 24px rgba(0,0,0,0.3)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:110px}
.header{background:var(--gradient);color:#fff;padding:20px 16px 16px;border-radius:0 0 28px 28px;position:sticky;top:0;z-index:90;box-shadow:var(--shadow-lg)}
.header-row{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px}
.logo-icon{width:38px;height:38px;background:rgba(255,255,255,.22);border-radius:12px;display:flex;align-items:center;justify-content:center}
.h-actions{display:flex;gap:8px}
.h-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.conn{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);padding:5px 12px;border-radius:30px;font-size:11px;font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.25)}
.dot.off{background:#f87171;box-shadow:0 0 0 4px rgba(248,113,113,.25)}
.dot.wait{background:#fbbf24;box-shadow:0 0 0 4px rgba(251,191,36,.25)}
.stats{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s-card{background:var(--card);border-radius:20px;padding:16px 12px;box-shadow:var(--shadow);border:1px solid var(--border);text-align:center;cursor:pointer}
.s-card.active{border-color:var(--primary);box-shadow:0 8px 24px rgba(15,118,110,.15)}
.s-num{font-size:24px;font-weight:900;color:var(--primary);line-height:1}
.s-label{font-size:10px;color:var(--muted);font-weight:800;margin-top:5px}
.risk-wrap{margin:0 16px 10px;background:var(--card);border-radius:20px;padding:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.risk-head{font-size:12px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.risk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.r-chip{border-radius:14px;padding:9px 2px;text-align:center;cursor:pointer;border:2px solid transparent;background:var(--bg);transition:.2s}
.r-chip.active{border-color:var(--primary)}
.r-chip b{display:block;font-size:14px;font-weight:900}
.r-chip span{font-size:8px;font-weight:800;color:var(--muted)}
.alert{margin:0 16px 10px;background:#fff1f2;border:1px solid #fecdd3;border-radius:16px;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
[data-theme="dark"].alert{background:#450a0a;border-color:#7f1d1d}
.actions{padding:10px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.a-btn{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow);cursor:pointer}
.a-btn.primary{background:var(--gradient);color:#fff;border-color:transparent}
.search-wrap{margin:0 16px 10px;position:relative}
.search{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:11px 12px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.search input{border:none;outline:none;flex:1;background:transparent;font-family:'Cairo';font-size:13px;color:var(--text)}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);max-height:340px;overflow:auto;z-index:60;display:none}
.suggest.active{display:block}
.s-item{padding:11px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);cursor:pointer}
.s-avatar{width:38px;height:38px;border-radius:11px;background:#e0f2f1;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--primary);font-size:14px}
.filters{display:flex;gap:6px;padding:8px 16px;overflow:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f-chip{background:var(--card);border:1px solid var(--border);padding:7px 14px;border-radius:30px;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer;color:var(--muted)}
.f-chip.active{background:var(--gradient);color:#fff;border-color:transparent}
.list{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.c-card{background:var(--card);border-radius:22px;padding:14px 14px 12px;box-shadow:var(--shadow);border:1px solid var(--border);position:relative}
.c-card.overdue{border-right:4px solid var(--danger)}
.c-top{display:flex;gap:11px}
.c-avatar{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#ccfbf1,#99f6e0);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--primary);font-size:16px;flex-shrink:0}
.c-main{flex:1;min-width:0}
.c-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.c-name{font-size:15px;font-weight:800;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-badge{font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;display:inline-flex;gap:3px;align-items:center}
.r-badge.good{background:#dcfce7;color:#166534}.r-badge.medium{background:#fef9c3;color:#854d0e}.r-badge.weak{background:#ffedd5;color:#9a3412}.r-badge.veryWeak{background:#fecaca;color:#991b1b}.r-badge.dangerous{background:#ef4444;color:#fff}.r-badge.paid{background:#bbf7d0;color:#166534}
.c-amount{font-size:26px;font-weight:900;color:var(--primary);margin:6px 0 2px;letter-spacing:-0.5px}
.c-meta{display:flex;gap:8px;font-size:10px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.c-meta i{color:var(--primary-light)}
.c-debts{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.d-mini{font-size:9px;font-weight:800;background:var(--bg);border:1px solid var(--border);padding:3px 8px;border-radius:20px;display:inline-flex;gap:4px}
.city-row{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.city-btn{font-size:9px;font-weight:800;padding:4px 9px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--muted)}
.city-btn.active{background:var(--gradient);color:#fff;border-color:transparent}
.c-actions{margin-top:10px;display:flex;gap:6px}
.ic-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:.15s}
.ic-btn:active{transform:scale(.92)}
.ic-btn.primary{background:var(--gradient);color:#fff;border-color:transparent}
.ic-btn.danger{background:#fef2f2;color:var(--danger);border-color:#fecdd3}
.ic-btn.edit{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:10px;background:var(--bg);border:1px solid var(--border)}
.fab{position:fixed;bottom:20px;left:20px;width:56px;height:56px;border-radius:18px;background:var(--gradient);color:#fff;border:none;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(15,118,110,.35);cursor:pointer;z-index:80}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal.active{display:flex}
.m-card{background:var(--card);border-radius:22px;padding:18px;width:100%;max-width:360px;box-shadow:var(--shadow-lg);animation:pop.22s ease}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.m-title{font-size:15px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.m-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.m-input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:#f8fafc;color:var(--text);font-family:'Cairo';font-size:13px;outline:none;margin-bottom:8px}
.m-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.m-btn{padding:10px;border-radius:12px;border:none;font-family:'Cairo';font-weight:800;font-size:12px;cursor:pointer}
.m-btn.cancel{background:#f1f5f9;color:var(--muted);border:1px solid var(--border)}
.m-btn.confirm{background:var(--gradient);color:#fff}
.m-btn.danger{background:var(--danger);color:#fff}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--card);border:1px solid var(--border);padding:10px 14px;border-radius:14px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;z-index:120;transition:.35s}
.toast.show{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
@media (min-width:700px){body{max-width:520px;margin:0 auto}}
</style>
</head>
<body>
<header class="header">
<div class="header-row">
<div class="logo"><div class="logo-icon"><i class="fas fa-book"></i></div> Karni Pro</div>
<div class="h-actions">
<button class="h-btn" onclick="toggleTheme()" title="الوضع"><i class="fas fa-moon" id="themeIcon"></i></button>
<button class="h-btn" onclick="openReportsPage()" title="التقارير"><i class="fas fa-chart-bar"></i></button>
</div>
</div>
<div class="conn" id="connStatus"><span class="dot wait" id="connDot"></span><span id="connText">جاري الاتصال...</span></div>
</header>

<div class="stats">
<div class="s-card active" id="statCustomers" onclick="filterByStatus('all')"><div class="s-num" id="totalCustomers">0</div><div class="s-label">👥 الزبناء</div></div>
<div class="s-card" onclick="filterByStatus('all')"><div class="s-num"><span id="totalAmount">0</span> <span style="font-size:13px">DH</span></div><div class="s-label">💰 الإجمالي</div></div>
<div class="s-card" id="statOverdue" onclick="filterByStatus('overdue')"><div class="s-num" id="overdueCount">0</div><div class="s-label">🔴 متأخر</div></div>
<div class="s-card" id="statToday" onclick="filterByStatus('today')"><div class="s-num" id="todayCount">0</div><div class="s-label">🟢 اليوم</div></div>
</div>

<div class="risk-wrap">
<div class="risk-head"><i class="fas fa-shield-halved" style="color:var(--primary)"></i> مستوى الخطر</div>
<div class="risk-grid">
<div class="r-chip good" id="riskGood" onclick="filterByRisk('good')"><b id="countGood">0</b><span>جيد</span></div>
<div class="r-chip medium" id="riskMedium" onclick="filterByRisk('medium')"><b id="countMedium">0</b><span>متوسط</span></div>
<div class="r-chip weak" id="riskWeak" onclick="filterByRisk('weak')"><b id="countWeak">0</b><span>ضعيف</span></div>
<div class="r-chip veryWeak" id="riskVeryWeak" onclick="filterByRisk('veryWeak')"><b id="countVeryWeak">0</b><span>ضعيف جدا</span></div>
<div class="r-chip dangerous" id="riskDangerous" onclick="filterByRisk('dangerous')"><b id="countDangerous">0</b><span>خطر</span></div>
</div>
</div>

<div id="dailyAlert" class="alert" style="display:none" onclick="filterByRisk('dangerous')">
<div style="display:flex;align-items:center;gap:8px"><i class="fas fa-triangle-exclamation" style="color:var(--danger)"></i><div><div style="font-weight:800;font-size:12px" id="alertTitle"></div><div style="font-size:10px;color:var(--muted)" id="alertDesc"></div></div></div>
<i class="fas fa-chevron-left" style="font-size:11px;color:var(--muted)"></i>
</div>

<div class="actions">
<button class="a-btn primary" onclick="openCalendar()"><i class="fas fa-calendar"></i> اليوم</button>
<button class="a-btn" onclick="openRoute()"><i class="fas fa-route"></i> المسار</button>
</div>

<div class="search-wrap" id="searchWrapper">
<div class="search"><i class="fas fa-search" style="color:var(--muted)"></i><input type="text" id="searchInput" placeholder="ابحث عن زبون..." autocomplete="off"><i class="fas fa-xmark" id="clearSearch" style="cursor:pointer;display:none;color:var(--muted)"></i></div>
<div class="suggest" id="searchSuggestions"></div>
</div>

<div class="filters">
<button class="f-chip active" onclick="filterByStatus('all')">الكل</button>
<button class="f-chip" onclick="filterByStatus('today')">اليوم</button>
<button class="f-chip" onclick="filterByStatus('overdue')">متأخر</button>
<button class="f-chip" onclick="filterByStatus('upcoming')">قادم</button>
<button class="f-chip" onclick="openCityFilter()"><i class="fas fa-location-dot"></i> المدينة</button>
<button class="f-chip" id="riskFilterTab" onclick="filterByRisk('all')" style="display:none;background:var(--primary);color:#fff"><span id="riskFilterText"></span> ✕</button>
</div>

<div class="list" id="customersList"><div class="empty"><div style="font-size:40px">📋</div><p>جاري التحميل...</p></div></div>

<button class="fab" onclick="showAddModal()"><i class="fas fa-plus"></i></button>

<div class="modal" id="cityFilterModal"><div class="m-card"><div class="m-title"><i class="fas fa-location-dot" style="color:var(--primary)"></i> اختر المدينة</div><div id="cityFilterList" style="max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:14px"></div><div class="m-actions"><button class="m-btn cancel" onclick="closeCityFilter()">إغلاق</button><button class="m-btn confirm" onclick="filterByCity('all')">الكل</button></div></div></div>

<div class="modal" id="customerModal"><div class="m-card"><div class="m-title"><i class="fas fa-user-plus" style="color:var(--primary)"></i> زبون جديد</div><form id="customerForm" onsubmit="saveCustomer(event)"><input type="hidden" id="customerId"><div style="margin-bottom:10px"><label style="font-size:11px;font-weight:800">الاسم *</label><input type="text" class="m-input" id="customerName" required placeholder="اسم الزبون"></div><div style="margin-bottom:10px"><label style="font-size:11px;font-weight:800">الهاتف</label><input type="tel" class="m-input" id="customerPhone" placeholder="06..."></div><div style="margin-bottom:10px"><label style="font-size:11px;font-weight:800">المبلغ *</label><input type="number" class="m-input" id="customerAmount" required placeholder="0"></div><div style="margin-bottom:10px"><label style="font-size:11px;font-weight:800">تاريخ الاستحقاق *</label><input type="date" class="m-input" id="customerDate" required></div><div class="m-actions"><button type="button" class="m-btn cancel" onclick="closeModal()">إلغاء</button><button type="submit" class="m-btn confirm">حفظ</button></div></form></div></div>

<div class="modal" id="customModal"><div class="m-card"><div class="m-title"><i class="fas fa-circle-info" style="color:var(--primary)"></i> <span id="customTitleText">تنبيه</span></div><div class="m-desc" id="customDesc">هل أنت متأكد؟</div><input type="text" id="customInput" class="m-input" style="display:none" placeholder=""><input type="password" id="customPassword" class="m-input" style="display:none" placeholder="كلمة المرور"><div class="m-actions"><button class="m-btn cancel" id="customCancel" onclick="closeCustomModal()">إلغاء</button><button class="m-btn confirm" id="customConfirm">تأكيد</button></div></div></div>

<div class="toast" id="toast"><i class="fas fa-check-circle" style="color:#10b981"></i><span id="toastMessage">تم</span></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, onValue, set, push, remove, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
const firebaseConfig = { apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y", authDomain: "karni-b9b34.firebaseapp.com", databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app", projectId: "karni-b9b34", storageBucket: "karni-b9b34.firebasestorage.app", messagingSenderId: "489835094040", appId: "1:489835094040:web:109e20fe7b65516903236d" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const customersRef = ref(db, 'customers');

let allCustomers={};
let currentStatusFilter='all', currentCityFilter='all', currentRiskFilter='all', currentSearchQuery='';
let searchTimer=null;
let isInitialLoadDone=false;
let isFirebaseListenerAttached=false;
const DEFAULT_CITIES=["TanTan","Ouatia","Gulmim"];
const RISK_LEVELS={good:{emoji:'🟢',label:'جيد',css:'good',score:1},medium:{emoji:'🟡',label:'متوسط',css:'medium',score:2},weak:{emoji:'🟠',label:'ضعيف',css:'weak',score:3},veryWeak:{emoji:'🔴',label:'ضعيف جدا',css:'veryWeak',score:4},dangerous:{emoji:'🚨',label:'خطر',css:'dangerous',score:5},paid:{emoji:'✅',label:'مسدد',css:'paid',score:0}};

// --- SMART CACHE ---
const smartDataCache = new Map(); // id -> { hash, data }
const customerHashCache = new Map(); // id -> last hash string

function getCustomerHash(c){
  if(!c) return '';
  // hash سريع وخفيف للكشف عن التغيير فقط
  const debtsLen = c.debts? c.debts.length : 0;
  const opsLen = c.operations? (Array.isArray(c.operations)?c.operations.length:Object.keys(c.operations).length) : 0;
  return `${c.name||''}|${c.amount||0}|${c.date||''}|${c.city||''}|${c.phone||''}|${debtsLen}|${opsLen}|${c.updatedAt||''}`;
}
function getOpsArray(customer){ const ops=customer.operations||[]; let arr=Array.isArray(ops)?ops:Object.values(ops); return arr.filter(o=>o).sort((a,b)=> new Date(a.date||0)-new Date(b.date||0)); }
function getCustomerAvgInterval(customer){
  const ops=getOpsArray(customer).filter(o=>o.type==='received'); if(ops.length<2) return 14;
  let intervals=[]; for(let i=1;i<ops.length;i++){ const diff=daysBetween(ops[i-1].date, ops[i].date); if(diff!==null && diff>0 && diff<90) intervals.push(diff); }
  if(intervals.length===0) return 14; intervals.sort((a,b)=>a-b); if(intervals.length>4) intervals=intervals.slice(1,-1);
  const avg=intervals.reduce((s,v)=>s+v,0)/intervals.length; return Math.max(3, Math.round(avg));
}
function ensureDebts(customer){
  if(customer.debts && Array.isArray(customer.debts) && customer.debts.length>0){
    return customer.debts.map(d=>{ const pays=d.payments||[]; const sum=pays.reduce((s,p)=>s+Number(p.amount||0),0); const rem=Math.max(0,(Number(d.originalAmount)||0)-sum); return {...d,remainingAmount:rem,payments:pays,startDate:d.startDate||customer.date,originalAmount:Number(d.originalAmount)||0}; });
  }
  let debts=[]; const base=parseFloat(customer.amount)||0;
  if(base>0){ debts.push({id:'debt_'+(customer.id||'legacy')+'_base',originalAmount:base,startDate:customer.date||customer.paymentDate||(customer.createdAt?customer.createdAt.split('T')[0]:new Date().toISOString().split('T')[0]),payments:[],createdAt:customer.createdAt||new Date().toISOString(),expectedDate:null}); }
  const ops=getOpsArray(customer);
  ops.forEach((op,idx)=>{ if(op.type==='paid' && Number(op.amount)>0){ debts.push({id:'debt_'+(customer.id||'c')+'_paid_'+idx+'_'+Date.now(),originalAmount:Number(op.amount),startDate:op.date||customer.date,payments:[],createdAt:op.date||new Date().toISOString(),expectedDate:null}); } });
  if(debts.length===0){ debts.push({id:'debt_empty_'+Date.now(),originalAmount:0,startDate:new Date().toISOString().split('T')[0],payments:[],createdAt:new Date().toISOString()}); }
  debts.sort((a,b)=> new Date(a.startDate)-new Date(b.startDate));
  const received=ops.filter(o=>o.type==='received' && Number(o.amount)>0).sort((a,b)=> new Date(a.date)-new Date(b.date));
  received.forEach(rec=>{ let left=Number(rec.amount); for(let debt of debts){ if(left<=0) break; const paidSum=(debt.payments||[]).reduce((s,p)=>s+Number(p.amount),0); const rem=debt.originalAmount-paidSum; if(rem<=0) continue; const take=Math.min(rem,left); debt.payments.push({amount:take,date:rec.date,time:rec.time||''}); left-=take; } });
  debts.forEach(d=>{ const sum=(d.payments||[]).reduce((s,p)=>s+Number(p.amount),0); d.remainingAmount=Math.max(0,d.originalAmount-sum); });
  return debts;
}
function toDateObj(str){ if(!str) return null; const d=new Date(str); if(isNaN(d)) return null; d.setHours(0,0,0,0); return d; }
function addDays(dateStr,days){ const d=toDateObj(dateStr); if(!d) return null; d.setDate(d.getDate()+days); return d.toISOString().split('T')[0]; }
function daysBetween(a,b){ const da=toDateObj(a), db=toDateObj(b); if(!da||!db) return null; return Math.floor((db-da)/86400000); }
function calcDebtRisk(debt,avgInterval){
  const remaining=Number(debt.remainingAmount||0); if(remaining<=0.5) return {level:'paid',...RISK_LEVELS.paid,daysLate:0,remaining,expectedDate:debt.expectedDate};
  let expectedStr=debt.expectedDate; if(!expectedStr){ const lastPay=(debt.payments&&debt.payments.length>0)? debt.payments[debt.payments.length-1].date:null; const baseDate=lastPay||debt.startDate; expectedStr=addDays(baseDate,avgInterval||14)||debt.startDate; }
  const today=new Date(); today.setHours(0,0,0,0); const exp=toDateObj(expectedStr); let daysLate=0; if(exp) daysLate=Math.floor((today-exp)/86400000);
  let level; if(daysLate<=0) level='good'; else if(daysLate>=1 && daysLate<=6) level='medium'; else if(daysLate>=7 && daysLate<=14) level='weak'; else if(daysLate>=15 && daysLate<=29) level='veryWeak'; else level='dangerous';
  return {level,...RISK_LEVELS[level],daysLate,remaining,expectedDate:expectedStr};
}
function getCustomerSmartDataRaw(customer){
  const avg=getCustomerAvgInterval(customer); const debts=ensureDebts(customer);
  let enriched=debts.map(d=>{ if(!d.expectedDate){ const lastPay=(d.payments&&d.payments.length>0)? d.payments[d.payments.length-1].date:null; const base=lastPay||d.startDate; d.expectedDate=addDays(base,avg)||d.startDate; } const risk=calcDebtRisk(d,avg); d.risk=risk; d.daysLate=risk.daysLate; return d; });
  const totalRemaining=enriched.reduce((s,d)=>s+Number(d.remainingAmount||0),0);
  const unpaid=enriched.filter(d=>d.remainingAmount>0.5); let worst={level:'good',score:0,...RISK_LEVELS.good}; let worstScore=0; unpaid.forEach(d=>{ if(d.risk.score>worstScore){worstScore=d.risk.score; worst=d.risk;} });
  const todayStr=new Date().toISOString().split('T')[0]; const hasToday=enriched.some(d=> d.remainingAmount>0.5 && d.expectedDate===todayStr); const hasOverdue=enriched.some(d=> d.remainingAmount>0.5 && d.risk.daysLate>0); const hasUpcoming=enriched.some(d=> d.remainingAmount>0.5 && d.risk.daysLate<=0);
  let nextDate=null; if(unpaid.length>0){ const sorted=[...unpaid].sort((a,b)=> new Date(a.expectedDate)-new Date(b.expectedDate)); nextDate=sorted[0].expectedDate; }
  return {debts:enriched,totalRemaining,unpaidCount:unpaid.length,worstRisk:worst,avgInterval:avg,hasToday,hasOverdue,hasUpcoming,nextPaymentDate:nextDate};
}
function getCachedSmartData(id, customer){
  const newHash = getCustomerHash(customer);
  const oldHash = customerHashCache.get(id);
  if(oldHash === newHash && smartDataCache.has(id)){
    return smartDataCache.get(id);
  }
  const smart = getCustomerSmartDataRaw(customer);
  smartDataCache.set(id, smart);
  customerHashCache.set(id, newHash);
  return smart;
}
// wrapper للحفاظ على الاسم القديم
function getCustomerSmartData(customer){
  // هذه الدالة الآن تستخدم الكاش تلقائيا اذا كان id موجود
  const id = customer.id || customer._id || '';
  if(id && smartDataCache.has(id)){
     const cachedHash = customerHashCache.get(id);
     const currentHash = getCustomerHash(customer);
     if(cachedHash === currentHash) return smartDataCache.get(id);
  }
  return getCustomerSmartDataRaw(customer);
}

function getCityCounts(filtered=null){ const source=filtered||allCustomers; const counts={"TanTan":0,"Ouatia":0,"Gulmim":0}; Object.values(source).forEach(c=>{ const city=(c.city||'').trim(); if(!city) return; const norm=DEFAULT_CITIES.find(dc=>dc.toLowerCase()===city.toLowerCase()); const key=norm||city; if(counts.hasOwnProperty(key)) counts[key]++; }); return counts; }

function applyAllFilters(){
  // كل الفلاتر من الذاكرة فقط - لا Firebase هنا
  let filtered={};
  const allKeys = Object.keys(allCustomers);

  // 1. بحث
  if(currentSearchQuery){
    const q=currentSearchQuery.toLowerCase();
    for(let i=0;i<allKeys.length;i++){
      const k=allKeys[i];
      const c=allCustomers[k];
      if((c.name||'').toLowerCase().includes(q)) filtered[k]=c;
    }
  } else {
    // نسخ سريع بدون بحث
    for(let i=0;i<allKeys.length;i++){ const k=allKeys[i]; filtered[k]=allCustomers[k]; }
  }

  // 2. مدينة
  if(currentCityFilter!=='all'){
    const lowerCity=currentCityFilter.toLowerCase();
    const tmp={};
    for(const k in filtered){ if((filtered[k].city||'').trim().toLowerCase()===lowerCity) tmp[k]=filtered[k]; }
    filtered=tmp;
  }

  // 3. حالة + خطر - يستخدم الكاش
  if(currentStatusFilter!=='all' || currentRiskFilter!=='all'){
    const tmp={};
    for(const k in filtered){
      const c=filtered[k];
      const sd=getCachedSmartData(k,c);
      let ok=true;
      if(currentStatusFilter!=='all'){
        if(currentStatusFilter==='today'&&!sd.hasToday) ok=false;
        else if(currentStatusFilter==='overdue'&&!sd.hasOverdue) ok=false;
        else if(currentStatusFilter==='upcoming'&&!sd.hasUpcoming) ok=false;
      }
      if(ok && currentRiskFilter!=='all'){
        if(sd.worstRisk.level!==currentRiskFilter &&!sd.debts.some(d=>d.risk.level===currentRiskFilter && d.remainingAmount>0.5)) ok=false;
      }
      if(ok) tmp[k]=filtered[k];
    }
    filtered=tmp;
  }

  renderCustomers(filtered);
  updateActiveStates();
}

function updateActiveStates(){
  document.querySelectorAll('.f-chip').forEach(c=>c.classList.remove('active'));
  const chips=document.querySelectorAll('.f-chip');
  chips.forEach(ch=>{ const txt=ch.textContent.trim(); if(currentStatusFilter==='all'&&txt==='الكل') ch.classList.add('active'); if(currentStatusFilter==='today'&&txt==='اليوم') ch.classList.add('active'); if(currentStatusFilter==='overdue'&&txt==='متأخر') ch.classList.add('active'); if(currentStatusFilter==='upcoming'&&txt==='قادم') ch.classList.add('active'); });
  document.querySelectorAll('.s-card').forEach(c=>c.classList.remove('active'));
  if(currentStatusFilter==='all') document.getElementById('statCustomers')?.classList.add('active');
  if(currentStatusFilter==='overdue') document.getElementById('statOverdue')?.classList.add('active');
  if(currentStatusFilter==='today') document.getElementById('statToday')?.classList.add('active');
  document.querySelectorAll('.r-chip').forEach(c=>c.classList.remove('active'));
  if(currentRiskFilter!=='all'){ const map={good:'riskGood',medium:'riskMedium',weak:'riskWeak',veryWeak:'riskVeryWeak',dangerous:'riskDangerous'}; if(map[currentRiskFilter]) document.getElementById(map[currentRiskFilter])?.classList.add('active'); }
  const riskTab=document.getElementById('riskFilterTab'); const riskText=document.getElementById('riskFilterText');
  if(currentRiskFilter==='all'){riskTab.style.display='none';} else {riskTab.style.display='inline-flex'; riskText.textContent=RISK_LEVELS[currentRiskFilter]?.emoji+' '+RISK_LEVELS[currentRiskFilter]?.label; riskTab.classList.add('active');}
}

function initFirebase(){
  if(isFirebaseListenerAttached) return;
  isFirebaseListenerAttached=true;
  setConn('wait','جاري الاتصال...');

  // مراقبة الاتصال الحقيقي - لا يعيد تحميل
  const connectedRef = ref(db, '.info/connected');
  onValue(connectedRef, (snap)=>{
    if(snap.val()===true){
      if(isInitialLoadDone) setConn('online','متصل');
    } else {
      setConn('off','غير متصل');
    }
  });

  onValue(customersRef,(snapshot)=>{
    const data=snapshot.val()||{};

    // تنظيف الكاش للمحذوفين فقط
    const newIds = new Set(Object.keys(data));
    for(const oldId of Object.keys(allCustomers)){
      if(!newIds.has(oldId)){
        smartDataCache.delete(oldId);
        customerHashCache.delete(oldId);
      }
    }
    // كشف التغييرات - لا نحسب كل شيء، فقط نحذف الكاش للمتغيرين
    for(const id in data){
      const oldHash = customerHashCache.get(id);
      const newHash = getCustomerHash(data[id]);
      if(oldHash && oldHash!== newHash){
        smartDataCache.delete(id); // سيعاد حسابه عند الحاجة فقط
      }
    }

    allCustomers=data;

    if(!isInitialLoadDone){
      isInitialLoadDone=true;
      setConn('online','متصل');
    }
    // render واحد فقط من الذاكرة
    applyAllFilters();
  },(error)=>{
    setConn('off','غير متصل');
  });
}

function setConn(state,text){
  const dot=document.getElementById('connDot'); const txt=document.getElementById('connText');
  if(!dot||!txt) return;
  dot.className='dot '+(state==='online'?'':state==='off'?'off':'wait'); txt.textContent=text;
}

function renderCustomers(customers){
  const list=document.getElementById('customersList');
  if(!list) return;
  const keys = Object.keys(customers);
  if(keys.length===0){
    list.innerHTML=`<div class="empty"><div style="font-size:36px">👥</div><p>لا يوجد زبناء</p></div>`;
    updateStats({totalAmount:0,customersCount:0,todayCount:0,overdueCount:0});
    updateRiskStats({});
    return;
  }

  let totalAmount=0, todayCount=0, overdueCount=0;
  const riskCounts={good:0,medium:0,weak:0,veryWeak:0,dangerous:0};
  const htmlParts = [];
  htmlParts.length = keys.length;

  for(let idx=0; idx<keys.length; idx++){
    const key = keys[idx];
    const customer = customers[key];
    const smart = getCachedSmartData(key, customer);

    totalAmount+=smart.totalRemaining;
    if(smart.hasToday) todayCount++;
    if(smart.hasOverdue) overdueCount++;
    if(smart.worstRisk.level!=='paid') riskCounts[smart.worstRisk.level]=(riskCounts[smart.worstRisk.level]||0)+1;

    const overdueClass=smart.hasOverdue?'overdue':'';
    const cityBtns=["TanTan","Ouatia","Gulmim"].map(cn=>{
      const active=(customer.city||'').toLowerCase()===cn.toLowerCase();
      return `<button class="city-btn ${active?'active':''}" onclick="event.stopPropagation(); setCustomerCity('${key}','${cn}')">${cn}</button>`;
    }).join('');

    let miniDebts='';
    const activeDebts = smart.debts.filter(d=>d.remainingAmount>0.5);
    const show = activeDebts.slice(0,2);
    for(let i=0;i<show.length;i++){
      const d=show[i];
      miniDebts+=`<span class="d-mini">📦 ${i+1} • ${Math.round(d.remainingAmount)} DH • ${d.risk.emoji}</span>`;
    }
    if(activeDebts.length>2) miniDebts+=`<span class="d-mini">+${activeDebts.length-2}</span>`;
    if(activeDebts.length===0) miniDebts='<span class="d-mini">✅ مسدد</span>';

    const riskBadge=smart.unpaidCount>0? `<span class="r-badge ${smart.worstRisk.css}">${smart.worstRisk.emoji} ${smart.worstRisk.label}</span>`:`<span class="r-badge paid">✅ مسدد</span>`;

    htmlParts[idx]=`
    <div class="c-card ${overdueClass}" onclick="openDetails('${key}')">
      <button class="ic-btn edit" onclick="event.stopPropagation(); editCustomerName('${key}')" title="تعديل الاسم"><i class="fas fa-pen"></i></button>
      <div class="c-top">
        <div class="c-avatar">${(customer.name||'?').charAt(0).toUpperCase()}</div>
        <div class="c-main">
          <div class="c-name-row"><div class="c-name">${customer.name||'بدون اسم'}</div>${riskBadge}</div>
          <div class="c-amount">${Math.round(smart.totalRemaining)} <span style="font-size:13px">DH</span></div>
          <div class="c-meta"><span><i class="fas fa-calendar"></i> ${smart.nextPaymentDate||customer.date||'-'}</span><span><i class="fas fa-phone"></i> ${customer.phone||'-'}</span></div>
          <div class="c-debts">${miniDebts}</div>
          <div class="city-row"><span style="font-size:10px;color:var(--muted)"><i class="fas fa-location-dot"></i> ${customer.city||'بدون مدينة'}</span><div style="display:flex;gap:4px;margin-right:6px">${cityBtns}</div></div>
        </div>
      </div>
      <div class="c-actions">
        <button class="ic-btn danger" onclick="event.stopPropagation(); confirmDelete('${key}')" title="حذف"><i class="fas fa-trash"></i></button>
        <button class="ic-btn" onclick="event.stopPropagation(); setPaymentDate('${key}')" title="تاريخ الاستحقاق"><i class="fas fa-calendar"></i></button>
        <button class="ic-btn" onclick="event.stopPropagation(); editCustomerPhone('${key}')" title="الهاتف"><i class="fas fa-phone"></i></button>
        <button class="ic-btn primary" onclick="event.stopPropagation(); openDetails('${key}')" title="التفاصيل"><i class="fas fa-user"></i></button>
      </div>
    </div>`;
  }

  // تحديث DOM مرة واحدة فقط - لا innerHTML += في loop
  list.innerHTML = htmlParts.join('');
  updateStats({totalAmount,customersCount:keys.length,todayCount,overdueCount});
  updateRiskStats(riskCounts);
}

function showSuggestions(query){
  const box=document.getElementById('searchSuggestions'); const input=document.getElementById('searchInput'); const clear=document.getElementById('clearSearch'); if(!box||!input) return;
  const q=query.trim().toLowerCase(); currentSearchQuery=query.trim();
  if(!q){ hideSuggestions(); clear.style.display='none'; applyAllFilters(); return; } clear.style.display='block';

  // سريع من الذاكرة فقط مع الكاش
  const matched=[];
  for(const k in allCustomers){
    const c=allCustomers[k];
    if((c.name||'').toLowerCase().includes(q)){
      const smart=getCachedSmartData(k,c);
      matched.push([k,c,smart]);
      if(matched.length>50) break;
    }
  }
  if(matched.length===0){ box.innerHTML=`<div style="padding:14px;text-align:center;color:var(--muted)">🔍 لا توجد نتائج</div>`; box.classList.add('active'); renderCustomers({}); return; }
  matched.sort((a,b)=>{ const an=(a[1].name||'').toLowerCase(), bn=(b[1].name||'').toLowerCase(); const aS=an.startsWith(q)?0:1, bS=bn.startsWith(q)?0:1; if(aS!==bS) return aS-bS; return an.localeCompare(bn); });
  const html = matched.slice(0,15).map(([key,c,smart])=>{ const initial=(c.name||'?').charAt(0).toUpperCase(); return `<div class="s-item" onclick="openDetails('${key}')"><div class="s-avatar">${initial}</div><div style="flex:1"><div style="font-weight:800;font-size:12px">${c.name} • ${c.city||''}</div><div style="font-size:11px;color:var(--primary);font-weight:700">${Math.round(smart.totalRemaining)} DH • ${smart.worstRisk.emoji} ${smart.worstRisk.label}</div></div><i class="fas fa-chevron-left" style="color:var(--muted);font-size:11px"></i></div>`; }).join('');
  box.innerHTML=html; box.classList.add('active');
  applyAllFilters();
}

window.filterByCity=function(city){ currentCityFilter=city; closeCityFilter(); applyAllFilters(); showToast(city==='all'?'جميع المدن':`مدينة ${city}`); }
window.openReportsPage=function(){
  showCustomModal({title:'دخول المسؤول',desc:'أدخل كلمة المرور للوصول للتقارير',showPassword:true,placeholder:'كلمة المرور',confirmText:'دخول',cancelText:'إلغاء',onConfirm:(pass)=>{ if(pass==='1234@1234'){ showToast('✅ مرحبا'); setTimeout(()=>window.location.href='products.html',400); } else { showToast('❌ كلمة المرور غير صحيحة'); } }});
}
window.setPaymentDate=function(id){
  const customer=allCustomers[id]; if(!customer) return;
  showCustomModal({title:'تعديل التاريخ',desc:`تاريخ الاستحقاق لـ ${customer.name}`,showInput:true,inputType:'date',inputValue:customer.date||new Date().toISOString().split('T')[0],confirmText:'حفظ',cancelText:'إلغاء',onConfirm:(val)=>{ if(!val) return; updateCustomer(id,{date:val,updatedAt:new Date().toISOString()}); }});
}
window.editCustomerName=function(id){
  const customer=allCustomers[id]; if(!customer) return;
  showCustomModal({title:'تعديل الاسم',desc:'أدخل الاسم الجديد',showInput:true,inputValue:customer.name||'',placeholder:'الاسم الجديد',confirmText:'حفظ',cancelText:'إلغاء',onConfirm:(v)=>{ if(v && v.trim()) updateCustomer(id,{name:v.trim(),updatedAt:new Date().toISOString()}); }});
}
window.editCustomerPhone=function(id){
  const customer=allCustomers[id]; if(!customer) return;
  showCustomModal({title:'تعديل الهاتف',desc:`رقم هاتف ${customer.name}`,showInput:true,inputType:'tel',inputValue:customer.phone||'',placeholder:'06...',confirmText:'حفظ',cancelText:'إلغاء',onConfirm:(v)=>{ updateCustomer(id,{phone:v||'',updatedAt:new Date().toISOString()}); }});
}
</script>
<script>
const appVersion="11"; if(localStorage.getItem("appVersion")!==appVersion){ localStorage.clear(); window.location.href="login.html"; }
if(!localStorage.getItem("loggedIn")){ window.location.href="login.html"; }
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js',{scope:'./'})); }
</script>
