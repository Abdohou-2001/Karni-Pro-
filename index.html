    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #0f766e; --primary-light: #14b8a6;
            --gradient: linear-gradient(135deg, #0f766e 0%, #14b8a6 50%, #2dd4bf 100%);
            --danger: #ef4444; --warning: #f59e0b; --success: #22c55e;
            --bg: #f0fdfd; --card: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #ccfbf1;
            --shadow-md: 0 4px 15px rgba(15, 118, 110, 0.1); --shadow-lg: 0 10px 30px rgba(15, 118, 110, 0.15);
            --radius: 18px; --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --text-muted: #94a3b8; --border: #334155; --shadow-md: 0 4px 15px rgba(0,0,0,0.4); --shadow-lg: 0 10px 30px rgba(0,0,0,0.5); }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:120px;transition:var(--transition);font-weight:500}
        .header{background:var(--gradient);color:white;padding:35px 20px 25px;text-align:center;border-radius:0 0 35px 35px;box-shadow:var(--shadow-lg);position:sticky;top:0;z-index:100}
        .header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
        .header h1{font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:12px}
        .icon-btn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
        .sync-status{background:rgba(255,255,255,0.25);padding:6px 14px;border-radius:50px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;margin-top:10px}
        .sync-status.online i{color:#4ade80;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(1.2)}}
        .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:24px 20px 10px}
        .stat-card{background:var(--card);padding:24px 15px;border-radius:var(--radius);text-align:center;box-shadow:var(--shadow-md);border:1px solid var(--border);transition:var(--transition);cursor:pointer}
        .stat-card.active-stat{border:2px solid var(--primary);background:linear-gradient(135deg,var(--card) 0%,#ccfbf1 100%);transform:scale(0.97)}
        .stat-number{font-size:30px;font-weight:900;color:var(--primary);margin-bottom:6px}
        .stat-label{font-size:13px;color:var(--text-muted);font-weight:700}
        .risk-dashboard{margin:15px 20px;padding:18px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-md);border:1px solid var(--border)}
        .risk-title{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .risk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
        .risk-card{padding:12px 6px;border-radius:14px;text-align:center;cursor:pointer;border:2px solid transparent;transition:var(--transition);background:var(--bg)}
        .risk-card.active-risk{border-color:var(--primary);transform:scale(0.97);box-shadow:var(--shadow-md)}
        .risk-emoji{font-size:22px;margin-bottom:4px}
        .risk-count{font-size:18px;font-weight:900;color:var(--text)}
        .risk-label{font-size:10px;font-weight:800;color:var(--text-muted);margin-top:2px}
        .daily-alert{margin:0 20px 12px;padding:14px 16px;background:linear-gradient(135deg,#fef2f2,#fecaca);border:2px solid #fca5a5;border-radius:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
        [data-theme="dark"] .daily-alert{background:linear-gradient(135deg,#450a0a,#7f1d1d);border-color:#dc2626;color:white}
        .actions-row{padding:15px 20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .action-btn{background:var(--card);border:2px solid var(--border);padding:16px 14px;border-radius:var(--radius);font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:var(--transition);color:var(--text);box-shadow:var(--shadow-md)}
        .action-btn.primary{background:var(--gradient);color:white;border-color:transparent}
        .search-wrapper{position:relative;margin:0 20px 15px}
        .search-box{background:var(--card);padding:14px 18px;border-radius:var(--radius);box-shadow:var(--shadow-md);display:flex;align-items:center;gap:10px;border:2px solid var(--border)}
        .search-box input{border:none;outline:none;flex:1;font-family:'Cairo',sans-serif;font-size:15px;background:transparent;color:var(--text)}
        .search-suggestions{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:2px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);max-height:380px;overflow-y:auto;z-index:500;display:none}
        .search-suggestions.active{display:block}
        .suggestion-item{padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;border-bottom:1px solid var(--border)}
        .suggestion-avatar{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#e2e8f0 0%,#cbd5e1 100%);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--primary);flex-shrink:0}
        .filter-tabs{display:flex;gap:8px;padding:15px 20px;overflow-x:auto;scrollbar-width:none}
        .filter-tabs::-webkit-scrollbar{display:none}
        .filter-tab{background:var(--card);border:2px solid var(--border);padding:10px 18px;border-radius:50px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--text-muted)}
        .filter-tab.active{background:var(--gradient);color:white;border-color:transparent}

        .customer-meta{display:flex;gap:10px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;margin-bottom:8px}

        .debt-mini{font-size:11px;font-weight:700;color:var(--text-muted);background:var(--bg);padding:5px 10px;border-radius:20px;display:inline-flex;gap:6px;align-items:center;width:fit-content;max-width:100%}
        .customer-actions{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-top:12px}
        .btn{padding:11px 14px;border:none;border-radius:12px;font-family:'Cairo',sans-serif;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
        .btn-profile{background:linear-gradient(135deg,#3b82f6 0%,#2563eb 100%);color:white}
        .btn-delete{background:linear-gradient(135deg,var(--danger) 0%,#dc2626 100%);color:white}
        .btn-calendar{background:linear-gradient(135deg,#14b8a6 0%,#0f766e 100%);color:white}
        .btn-phone{background:linear-gradient(135deg,#06b6d4 0%,#2563eb 100%);color:white}
        .fab{position:fixed;bottom:30px;left:30px;width:65px;height:65px;border-radius:50%;background:var(--gradient);color:white;border:none;font-size:32px;cursor:pointer;box-shadow:0 10px 30px rgba(15,118,110,0.4);display:flex;align-items:center;justify-content:center;z-index:999}
        .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:1000;backdrop-filter:blur(8px)}
        .modal.active{display:flex;align-items:center;justify-content:center;padding:20px}
        .modal-content{background:var(--card);border-radius:25px;padding:30px 25px;width:100%;max-width:450px;box-shadow:var(--shadow-lg)}
        .form-group{margin-bottom:20px}
        .form-label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
        .form-input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:12px;font-family:'Cairo',sans-serif;font-size:15px;background:var(--bg);color:var(--text)}
        .form-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:25px}
        .btn-save{background:var(--gradient);color:white}
        .btn-cancel{background:var(--bg);color:var(--text-muted);border:2px solid var(--border)}
        .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-150px);background:var(--card);padding:14px 20px;border-radius:14px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;font-weight:700;z-index:2000;transition:transform 0.3s}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
        .city-quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
        .city-quick-btn{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800;border:2px solid var(--border);background:var(--card);color:var(--text-muted);cursor:pointer;font-family:'Cairo',sans-serif}
        .city-quick-btn.active-city-btn{background:var(--gradient);color:white;border-color:transparent}
        .city-filter-item{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:1px solid var(--border);font-weight:700}
        .city-filter-item.active-city{background:var(--gradient);color:white}
        .city-count{background:var(--bg);color:var(--text-muted);padding:2px 10px;border-radius:20px;font-size:12px;font-weight:800}
        @media (max-width:380px){.stats-grid{grid-template-columns:1fr}}
        @media (min-width:768px){body{max-width:600px;margin:0 auto}}
    </style>
</head>

            <div class="risk-card" id="riskVeryWeak" onclick="filterByRisk('veryWeak')"><div class="risk-emoji">🔴</div><div class="risk-count" id="countVeryWeak">0</div><div class="risk-label">ضعيف جدا</div></div>
            <div class="risk-card" id="riskDangerous" onclick="filterByRisk('dangerous')"><div class="risk-emoji">🚨</div><div class="risk-count" id="countDangerous">0</div><div class="risk-label">خطر</div></div>

    <div class="modal" id="cityFilterModal"><div class="modal-content"><h3 style="margin-bottom:20px;font-size:22px"><i class="fas fa-city" style="color:var(--primary)"></i> اختر المدينة</h3><div id="cityFilterList" style="max-height:350px;overflow-y:auto;border:2px solid var(--border);border-radius:14px"></div><div class="form-buttons" style="margin-top:15px"><button class="btn btn-save" onclick="filterByCity('all')">🔄 الكل</button><button class="btn btn-cancel" onclick="closeCityFilter()">إغلاق</button></div></div></div>

    <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">تم الحفظ</span></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue, set, push, remove, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        const firebaseConfig = {
          apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
          authDomain: "karni-b9b34.firebaseapp.com",
          databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "karni-b9b34",
          storageBucket: "karni-b9b34.firebasestorage.app",
          messagingSenderId: "489835094040",
          appId: "1:489835094040:web:109e20fe7b65516903236d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const customersRef = ref(db, 'customers');
        let allCustomers = {};
        let currentStatusFilter = 'all';
        let currentCityFilter = 'all';
        let currentRiskFilter = 'all';
        let currentSearchQuery = '';
        let searchTimer;
        const DEFAULT_CITIES = ["TanTan", "Ouatia", "Gulmim"];
        const RISK_LEVELS = {
            good:{emoji:'🟢',label:'جيد',css:'good',score:1},
            medium:{emoji:'🟡',label:'متوسط',css:'medium',score:2},
            weak:{emoji:'🟠',label:'ضعيف',css:'weak',score:3},
            veryWeak:{emoji:'🔴',label:'ضعيف جدا',css:'veryWeak',score:4},
            dangerous:{emoji:'🚨',label:'خطر',css:'dangerous',score:5},
            paid:{emoji:'✅',label:'مسدد',css:'good',score:0}
        };
        function toDateObj(str){ if(!str) return null; const d=new Date(str); if(isNaN(d)) return null; d.setHours(0,0,0,0); return d; }
        function addDays(dateStr, days){ const d=toDateObj(dateStr); if(!d) return null; d.setDate(d.getDate()+days); return d.toISOString().split('T')[0]; }
        function daysBetween(a,b){ const da=toDateObj(a), db=toDateObj(b); if(!da||!db) return null; return Math.floor((db-da)/86400000); }
        function getOpsArray(customer){ const ops = customer.operations || []; let arr = Array.isArray(ops) ? ops : Object.values(ops); return arr.filter(o=>o).sort((a,b)=> new Date(a.date||0)-new Date(b.date||0)); }
        function getCustomerAvgInterval(customer){
            const ops = getOpsArray(customer).filter(o=>o.type==='received');
            if(ops.length < 2) return 14;
            let intervals = []; for(let i=1;i<ops.length;i++){ const diff = daysBetween(ops[i-1].date, ops[i].date); if(diff!==null && diff>0 && diff<90) intervals.push(diff); }
            if(intervals.length===0) return 14; intervals.sort((a,b)=>a-b); if(intervals.length>4) intervals = intervals.slice(1,-1);
            const avg = intervals.reduce((s,v)=>s+v,0)/intervals.length; return Math.max(3, Math.round(avg));
        }
        function ensureDebts(customer){
            if(customer.debts && Array.isArray(customer.debts) && customer.debts.length>0){
                return customer.debts.map(d=>{ const pays = d.payments||[]; const sum = pays.reduce((s,p)=>s+Number(p.amount||0),0); const rem = Math.max(0, (Number(d.originalAmount)||0)-sum); return {...d, remainingAmount: rem, payments:pays, startDate: d.startDate||customer.date, originalAmount: Number(d.originalAmount)||0}; });
            }
            let debts = []; const base = parseFloat(customer.amount)||0;
            if(base>0){ debts.push({ id: 'debt_'+(customer.id||'legacy')+'_base', originalAmount: base, startDate: customer.date || customer.paymentDate || (customer.createdAt? customer.createdAt.split('T')[0] : new Date().toISOString().split('T')[0]), payments: [], createdAt: customer.createdAt || new Date().toISOString(), expectedDate: null }); }
            const ops = getOpsArray(customer);
            ops.forEach((op, idx)=>{ if(op.type==='paid' && Number(op.amount)>0){ debts.push({ id: 'debt_'+(customer.id||'c')+'_paid_'+idx+'_'+Date.now(), originalAmount: Number(op.amount), startDate: op.date || customer.date, payments: [], createdAt: op.date || new Date().toISOString(), expectedDate: null }); } });
            if(debts.length===0){ debts.push({ id: 'debt_empty_'+Date.now(), originalAmount: 0, startDate: new Date().toISOString().split('T')[0], payments: [], createdAt: new Date().toISOString() }); }
            debts.sort((a,b)=> new Date(a.startDate)-new Date(b.startDate));
            const received = ops.filter(o=>o.type==='received' && Number(o.amount)>0).sort((a,b)=> new Date(a.date)-new Date(b.date));
            received.forEach(rec=>{ let left = Number(rec.amount); for(let debt of debts){ if(left<=0) break; const paidSum = (debt.payments||[]).reduce((s,p)=>s+Number(p.amount),0); const rem = debt.originalAmount - paidSum; if(rem<=0) continue; const take = Math.min(rem, left); debt.payments.push({amount: take, date: rec.date, time: rec.time||''}); left -= take; } });
            debts.forEach(d=>{ const sum = (d.payments||[]).reduce((s,p)=>s+Number(p.amount),0); d.remainingAmount = Math.max(0, d.originalAmount - sum); });
            return debts;
        }
        // === FIXED RISK LOGIC: Good impossible if overdue ===
        function calcDebtRisk(debt, avgInterval){
            const remaining = Number(debt.remainingAmount||0);
            const original = Number(debt.originalAmount||0);
            if(remaining<=0.5) return {level:'paid', ...RISK_LEVELS.paid, daysLate:0, remaining, original, pct:0, expectedDate: debt.expectedDate};
            let expectedStr = debt.expectedDate;
            if(!expectedStr){
                const lastPay = (debt.payments && debt.payments.length>0) ? debt.payments[debt.payments.length-1].date : null;
                const baseDate = lastPay || debt.startDate;
                expectedStr = addDays(baseDate, avgInterval||14) || debt.startDate;
            }
            const today = new Date(); today.setHours(0,0,0,0);
            const exp = toDateObj(expectedStr);
            let daysLate = 0;
            if(exp) daysLate = Math.floor((today-exp)/86400000);
            // GOLDEN RULE: if Remaining>0 and Today>Expected => cannot be Good
            let level;
            if(daysLate<=0) level='good';
            else if(daysLate>=1 && daysLate<=6) level='medium';
            else if(daysLate>=7 && daysLate<=14) level='weak';
            else if(daysLate>=15 && daysLate<=29) level='veryWeak';
            else level='dangerous';
            return {level, ...RISK_LEVELS[level], daysLate, remaining, original, pct: original>0? remaining/original:1, expectedDate: expectedStr};
        }
        function getCustomerSmartData(customer){
            const avg = getCustomerAvgInterval(customer);
            const debts = ensureDebts(customer);
            let enriched = debts.map(d=>{
                if(!d.expectedDate){
                    const lastPay = (d.payments && d.payments.length>0) ? d.payments[d.payments.length-1].date : null;
                    const base = lastPay || d.startDate;
                    d.expectedDate = addDays(base, avg) || d.startDate;
                }
                const risk = calcDebtRisk(d, avg);
                d.risk = risk; d.daysLate = risk.daysLate; return d;
            });
            const totalRemaining = enriched.reduce((s,d)=>s+Number(d.remainingAmount||0),0);
            const unpaid = enriched.filter(d=>d.remainingAmount>0.5);
            const paid = enriched.filter(d=>d.remainingAmount<=0.5);
            let worst = {level:'good',score:0, ...RISK_LEVELS.good};
            let worstScore = 0;
            unpaid.forEach(d=>{ if(d.risk.score>worstScore){worstScore=d.risk.score; worst=d.risk;} });
            const todayStr = new Date().toISOString().split('T')[0];
            const hasToday = enriched.some(d=> d.remainingAmount>0.5 && d.expectedDate===todayStr);
            const hasOverdue = enriched.some(d=> d.remainingAmount>0.5 && d.risk.daysLate>0);
            const hasUpcoming = enriched.some(d=> d.remainingAmount>0.5 && d.risk.daysLate<=0);
            // next payment = earliest expected among unpaid
            let nextDate = null;
            if(unpaid.length>0){
                const sorted = [...unpaid].sort((a,b)=> new Date(a.expectedDate)-new Date(b.expectedDate));
                nextDate = sorted[0].expectedDate;
            }
            return {debts: enriched, totalRemaining, unpaidCount: unpaid.length, paidCount: paid.length, worstRisk: worst, avgInterval: avg, hasToday, hasOverdue, hasUpcoming, nextPaymentDate: nextDate};
        }

                const card = `
