    .form-group{margin-bottom:15px}

    .btn{padding:12px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}
    .btn-save{background:linear-gradient(135deg,#00b894 0%, #00cec9 100%);color:white}
    .btn-cancel{background:#f1f2f6;color:#636e72}
</style>

<body>
<div class="header">

<div class="modal" id="addDebtModal">

        <h3 style="margin-bottom:15px">➕ إضافة دين جديد</h3>

        <div class="form-group"><label class="form-label">تاريخ البداية *</label><input type="date" id="newDebtDate" class="form-input"></div>
        <div class="form-group"><label class="form-label">ملاحظة</label><input type="text" id="newDebtNote" class="form-input" placeholder="سلعة..."></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get('id');
const loading = document.getElementById('loading');
const content = document.getElementById('content');
if(!id){alert('خطأ: ما كاينش id');window.location.href='index.html';}
const customerRef = ref(db, 'customers/' + id);
let customerOperations = [];
let customerDebts = [];
let currentCity = "";
let customerDataCache = null;
const RISK = {
    good:{emoji:'🟢',label:'جيد',css:'good'},
    medium:{emoji:'🟡',label:'متوسط',css:'medium'},
    weak:{emoji:'🟠',label:'ضعيف',css:'weak'},
    veryWeak:{emoji:'🔴',label:'ضعيف جدا',css:'veryWeak'},
    dangerous:{emoji:'🚨',label:'خطر',css:'dangerous'},
    paid:{emoji:'✅',label:'مسدد',css:'paid'}
};
function toDateObj(str){ if(!str) return null; const d=new Date(str); if(isNaN(d)) return null; d.setHours(0,0,0,0); return d; }
function addDays(dateStr, days){ const d=toDateObj(dateStr); if(!d) return null; d.setDate(d.getDate()+days); return d.toISOString().split('T')[0]; }
function daysBetween(a,b){ const da=toDateObj(a), db=toDateObj(b); if(!da||!db) return null; return Math.floor((db-da)/86400000); }
function getOpsArray(ops){ let arr = Array.isArray(ops)? ops : Object.values(ops||{}); return arr.filter(o=>o).sort((a,b)=> new Date(a.date||0)-new Date(b.date||0)); }
function getAvgInterval(ops){
    const rec = getOpsArray(ops).filter(o=>o.type==='received');
    if(rec.length<2) return 14;
    let intervals=[]; for(let i=1;i<rec.length;i++){ const diff=daysBetween(rec[i-1].date, rec[i].date); if(diff && diff>0 && diff<90) intervals.push(diff); }
    if(intervals.length===0) return 14; intervals.sort((a,b)=>a-b); if(intervals.length>4) intervals=intervals.slice(1,-1); const avg=intervals.reduce((s,v)=>s+v,0)/intervals.length; return Math.max(3, Math.round(avg));
}
function ensureDebts(customer){
    if(customer.debts && Array.isArray(customer.debts) && customer.debts.length>0){
        return customer.debts.map(d=>{ const sum=(d.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0); return {...d, remainingAmount: Math.max(0, (Number(d.originalAmount)||0)-sum)}; });
    }
    let debts=[]; const base=parseFloat(customer.amount)||0;
    if(base>0){ debts.push({id:'debt_'+(customer.id||'base')+'_base', originalAmount:base, startDate: customer.date||customer.paymentDate||(customer.createdAt?customer.createdAt.split('T')[0]:new Date().toISOString().split('T')[0]), payments:[], createdAt:customer.createdAt||new Date().toISOString(), expectedDate:null, note:'أساسي'}); }
    const ops=getOpsArray(customer.operations);
    ops.forEach((op,idx)=>{ if(op.type==='paid' && Number(op.amount)>0){ debts.push({id:'debt_'+(customer.id||'c')+'_paid_'+idx+'_'+Date.now(), originalAmount:Number(op.amount), startDate:op.date||customer.date, payments:[], createdAt:op.date||new Date().toISOString(), expectedDate:null, note:op.note||'إضافية'}); } });
    if(debts.length===0){ debts.push({id:'debt_empty_'+Date.now(), originalAmount:0, startDate:new Date().toISOString().split('T')[0], payments:[], createdAt:new Date().toISOString()}); }
    debts.sort((a,b)=> new Date(a.startDate)-new Date(b.startDate));
    const received=ops.filter(o=>o.type==='received' && Number(o.amount)>0).sort((a,b)=> new Date(a.date)-new Date(b.date));
    received.forEach(rec=>{ let left=Number(rec.amount); for(let debt of debts){ if(left<=0) break; const paidSum=(debt.payments||[]).reduce((s,p)=>s+Number(p.amount),0); const rem=debt.originalAmount-paidSum; if(rem<=0) continue; const take=Math.min(rem,left); debt.payments.push({amount:take, date:rec.date, time:rec.time||''}); left-=take; } });
    debts.forEach(d=>{ const sum=(d.payments||[]).reduce((s,p)=>s+Number(p.amount),0); d.remainingAmount=Math.max(0,d.originalAmount-sum); });
    return debts;
}
function calcRisk(debt, avg){
    const rem=Number(debt.remainingAmount||0); const orig=Number(debt.originalAmount||0);
    if(rem<=0.5) return {level:'paid', ...RISK.paid, daysLate:0, remaining:rem, original:orig, pct:0, expectedDate:debt.expectedDate};
    let expStr=debt.expectedDate;
    if(!expStr){ const lastPay=(debt.payments&&debt.payments.length>0)? debt.payments[debt.payments.length-1].date : null; const base=lastPay||debt.startDate; expStr=addDays(base, avg||14)||debt.startDate; }
    const today=new Date(); today.setHours(0,0,0,0); const exp=toDateObj(expStr); let daysLate=0; if(exp) daysLate=Math.floor((today-exp)/86400000);
    let level;
    if(daysLate<=0) level='good';
    else if(daysLate>=1 && daysLate<=6) level='medium';
    else if(daysLate>=7 && daysLate<=14) level='weak';
    else if(daysLate>=15 && daysLate<=29) level='veryWeak';
    else level='dangerous';
    return {level, ...RISK[level], daysLate, remaining:rem, original:orig, pct: orig>0? rem/orig:1, expectedDate:expStr};
}
function calculateTotal(debts){ const total = debts.reduce((s,d)=>s+Number(d.remainingAmount||0),0); document.getElementById('totalAmount').textContent = Math.round(total) + ' درهم'; return total; }
window.selectCityPerson = function(city){
    currentCity = city; document.getElementById('cityValue').value = city;
    document.querySelectorAll('.city-quick-btn-person').forEach(btn=>{ if(btn.dataset.city === city) btn.classList.add('active-city'); else btn.classList.remove('active-city'); });
}
function showSmartSummary(debts, avg){
    const unpaid = debts.filter(d=>d.remainingAmount>0.5);
    const paid = debts.filter(d=>d.remainingAmount<=0.5);
    const total = debts.reduce((s,d)=>s+Number(d.remainingAmount||0),0);
    const riskCounts = {good:0,medium:0,weak:0,veryWeak:0,dangerous:0,paid:0};
    debts.forEach(d=>{ const r = calcRisk(d, avg); d.risk=r; riskCounts[r.level]=(riskCounts[r.level]||0)+1; });
    const worst = unpaid.length>0 ? unpaid.map(d=>calcRisk(d,avg)).sort((a,b)=>b.daysLate-a.daysLate)[0] : null;
    const div = document.getElementById('smartSummary');
    div.innerHTML = `
        <div style="font-weight:800;font-size:16px;margin-bottom:10px">📊 ملخص الديون</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
            <span style="background:#f1f5f9;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">⏱️ متوسط السداد: ${avg} يوم</span>
            <span style="background:#f1f5f9;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">📦 ${debts.length} ديون</span>
            <span style="background:#dcfce7;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">💰 ${Math.round(total)} متبقي</span>
        </div>
        ${worst? `<div style="padding:10px;border-radius:12px;background:${worst.level==='dangerous'?'#fee2e2': worst.level==='veryWeak'?'#ffedd5':'#f0fdf4'}"><b>${worst.emoji} الحالة:</b> ${worst.label} ${worst.daysLate>0? ` - متأخر ${worst.daysLate} يوم`: ''}</div>` : '<div style="padding:10px;border-radius:12px;background:#dcfce7">✅ جميع الديون مسددة</div>'}
        <div class="smart-grid">
            <div class="smart-stat ${riskCounts.dangerous>0?'danger':''}"><div style="font-size:18px;font-weight:900">🚨 ${riskCounts.dangerous||0}</div><div style="font-size:11px">خطر</div></div>
            <div class="smart-stat ${riskCounts.veryWeak>0?'danger':''}"><div style="font-size:18px;font-weight:900">🔴 ${riskCounts.veryWeak||0}</div><div style="font-size:11px">ضعيف جدا</div></div>
            <div class="smart-stat"><div style="font-size:18px;font-weight:900">🟠 ${riskCounts.weak||0}</div><div style="font-size:11px">ضعيف</div></div>
            <div class="smart-stat"><div style="font-size:18px;font-weight:900">🟡 ${riskCounts.medium||0}</div><div style="font-size:11px">متوسط</div></div>
            <div class="smart-stat"><div style="font-size:18px;font-weight:900">🟢 ${riskCounts.good||0}</div><div style="font-size:11px">جيد</div></div>
            <div class="smart-stat"><div style="font-size:18px;font-weight:900">✅ ${riskCounts.paid||0}</div><div style="font-size:11px">مسدد</div></div>
        </div>
    `;
}
function toggleDebt(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.classList.toggle('open');
}
function showDebts(debts, avg){
    const list = document.getElementById('debtsList');
    document.getElementById('debtCount').textContent = debts.length + ' دين';
    if(debts.length===0){ list.innerHTML='<div style="text-align:center;color:#999;padding:20px">لا توجد ديون</div>'; return; }
    const sorted = [...debts].sort((a,b)=>{
        const ra = calcRisk(a,avg), rb = calcRisk(b,avg);
        if(a.remainingAmount<=0.5 && b.remainingAmount>0.5) return 1;
        if(b.remainingAmount<=0.5 && a.remainingAmount>0.5) return -1;
        return rb.daysLate - ra.daysLate;
    });
    list.innerHTML = sorted.map((debt, idx)=>{
        const risk = calcRisk(debt, avg);
        const isPaid = debt.remainingAmount<=0.5;

}
function showHistory(data){
    const historyList = document.getElementById('historyList');
    historyList.innerHTML = '';
    customerOperations = data.operations || [];
    if(customerOperations.length === 0){ historyList.innerHTML = '<div style="text-align:center;color:#999;padding:20px">لا توجد عمليات</div>'; return; }
    customerOperations.slice().reverse().forEach((op,index)=>{
        const div = document.createElement('div');
        div.className = 'history-item ' + (op.type === 'paid' ? 'history-paid' : '');
        const realIdx = customerOperations.length-1-index;
        div.innerHTML = `<div><div style="font-weight:bold">${op.amount} درهم - ${op.type === 'paid' ? 'سلعة' : 'تحصيل'}</div><div style="font-size:13px;color:#636e72">📅 ${op.date || '--'} ${op.time||''}</div></div><div style="display:flex;gap:6px"><button class="whatsapp-btn" onclick="sendReminderWhatsapp(${realIdx})">📱</button><button class="confirm-btn" onclick="sendConfirmWhatsapp(${realIdx})">✅</button><button onclick="editOperation(${realIdx})">✏️</button><button onclick="deleteOperation(${realIdx})">🗑️</button></div>`;
        historyList.appendChild(div);
    });
}
get(customerRef).then((snapshot)=>{
    loading.style.display = 'none';

        const data = snapshot.val();
        customerDataCache = data;
        const name = data.name || 'بدون اسم';

        document.getElementById('phone').textContent = data.phone || 'لا يوجد هاتف';
        document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();

        const avg = getAvgInterval(data.operations||[]);
        let debts = ensureDebts(data);
        debts.forEach(d=>{ if(!d.expectedDate){ const lastPay=(d.payments&&d.payments.length>0)? d.payments[d.payments.length-1].date : null; const base=lastPay||d.startDate; d.expectedDate=addDays(base, avg)||d.startDate; } });
        customerDebts = debts; customerOperations = getOpsArray(data.operations);
        calculateTotal(debts);
        document.getElementById('totalSub').textContent = `${debts.length} ديون • متوسط ${avg} يوم • ${debts.filter(d=>d.remainingAmount>0.5).length} غير مسددة`;
        showSmartSummary(debts, avg); showDebts(debts, avg); showHistory(data);
        if(!data.debts || data.debts.length===0){ update(customerRef, {debts: debts}).catch(e=>console.error(e)); }
    }else{ alert('الزبون غير موجود'); window.location.href = 'index.html'; }
}).catch((error)=>{ alert('خطأ: ' + error.message); window.location.href = 'index.html'; });
document.getElementById('saveBtn').addEventListener('click', ()=>{
    const btn = document.getElementById('saveBtn'); btn.textContent = '⏳ جاري الحفظ...'; btn.disabled = true;
    const date = document.getElementById('date').value;
    const paid = parseFloat(document.getElementById('paid').value) || 0;
    const received = parseFloat(document.getElementById('received').value) || 0;
    const city = document.getElementById('cityValue').value || currentCity || '';
    const now = new Date(); const today = now.toISOString().split('T')[0]; const currentTime = now.toTimeString().slice(0,5);
    let operations = [...customerOperations]; let debts = [...customerDebts]; debts.sort((a,b)=> new Date(a.startDate)-new Date(b.startDate));
    const avgBefore = getAvgInterval(operations);
    if(paid > 0){
        const newDebt = { id: 'debt_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), originalAmount: paid, startDate: today, expectedDate: addDays(today, avgBefore)||today, payments: [], remainingAmount: paid, createdAt: new Date().toISOString(), note: 'سلعة جديدة '+today };
        debts.push(newDebt); operations.push({type:'paid', amount: paid, date: today, time: currentTime, note: 'دين جديد'});
    }
    if(received > 0){
        let left = received;
        for(let debt of debts){ if(left<=0) break; const rem = Number(debt.remainingAmount||0); if(rem<=0.5) continue; const take = Math.min(rem, left); debt.payments = debt.payments||[]; debt.payments.push({amount: take, date: today, time: currentTime}); debt.remainingAmount = Math.max(0, rem - take); const newAvg = getAvgInterval([...operations, {type:'received', amount: received, date: today}]); debt.expectedDate = addDays(today, newAvg) || debt.expectedDate; left -= take; }
        operations.push({type:'received', amount: received, date: today, time: currentTime});
    }
    debts.forEach(d=>{ const sum = (d.payments||[]).reduce((s,p)=>s+Number(p.amount),0); d.remainingAmount = Math.max(0, (Number(d.originalAmount)||0)-sum); });
    const updateData = { date: date, paymentDate: date, city: city, operations: operations, debts: debts, paid: 0, received: 0, updatedAt: new Date().toISOString() };
    customerDebts = debts; customerOperations = operations;
    update(customerRef, updateData).then(()=>{ btn.textContent = '✅ تم الحفظ'; document.getElementById('paid').value = ''; document.getElementById('received').value = ''; const avg = getAvgInterval(operations); calculateTotal(debts); showSmartSummary(debts, avg); showDebts(debts, avg); showHistory({operations: operations}); setTimeout(()=>{ location.reload(); },800); }).catch((error)=>{ alert('خطأ: ' + error.message); btn.textContent = '💾 حفظ'; btn.disabled = false; });
});
window.deleteOperation = function(index){
    if(!confirm('حذف العملية؟ سيتم إعادة حساب الديون')) return;
    const ops = [...customerOperations]; ops.splice(index,1);
    const tempCustomer = {...customerDataCache, operations: ops, debts: null, amount: customerDataCache.amount};
    let newDebts = ensureDebts(tempCustomer); const avg = getAvgInterval(ops); newDebts.forEach(d=>{ if(!d.expectedDate){ const lastPay=(d.payments&&d.payments.length>0)? d.payments[d.payments.length-1].date : null; const base=lastPay||d.startDate; d.expectedDate=addDays(base, avg)||d.startDate; }});
    update(customerRef,{operations: ops, debts: newDebts, updatedAt: new Date().toISOString()}).then(()=>{ customerOperations = ops; customerDebts = newDebts; calculateTotal(newDebts); showSmartSummary(newDebts, avg); showDebts(newDebts, avg); showHistory({operations: ops}); });

window.editOperation = function(index){
    let amount = prompt('المبلغ الجديد', customerOperations[index].amount); if(amount === null) return;
    let date = prompt('التاريخ الجديد', customerOperations[index].date); if(date === null) return;

}
