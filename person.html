<style>
:root{--primary:#0f766e;--primary-light:#14b8a6;--gradient:linear-gradient(135deg,#0f766e 0%,#14b8a6 100%);--bg:#f6fbfb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e6f4f2;--danger:#ef4444;--radius:22px;--shadow:0 6px 24px rgba(15,118,110,0.07);--shadow-lg:0 12px 36px rgba(15,118,110,0.14)}

.label{font-size:11px;font-weight:800;color:var(--text);margin:12px 0 5px;display:block}
.input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:#f8fafc;font-size:12px;font-weight:700;outline:none}

.m-btn.cancel{background:#f1f5f9;color:var(--muted);border:1px solid var(--border)}

.m-btn.danger{background:var(--danger);color:#fff}
.toast{position:fixed;top:68px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--card);border:1px solid var(--border);padding:9px 12px;border-radius:12px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:6px;font-weight:700;font-size:11px;z-index:120;transition:.35s}
.toast.show{transform:translateX(-50%) translateY(0)}
.loading{text-align:center;padding:30px;color:var(--muted);font-size:12px}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y", authDomain: "karni-b9b34.firebaseapp.com", databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app", projectId: "karni-b9b34", storageBucket: "karni-b9b34.firebasestorage.app", messagingSenderId: "489835094040", appId: "1:489835094040:web:109e20fe7b65516903236d" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const urlParams = new URLSearchParams(window.location.search); const id = urlParams.get('id');
const loading=document.getElementById('loading'); const content=document.getElementById('content');
if(!id){ window.location.href='index.html'; }
const customerRef=ref(db,'customers/'+id);
let customerOperations=[], customerDebts=[], currentCity="", customerDataCache=null;
const RISK={good:{emoji:'🟢',label:'جيد',css:'good'},medium:{emoji:'🟡',label:'متوسط',css:'medium'},weak:{emoji:'🟠',label:'ضعيف',css:'weak'},veryWeak:{emoji:'🔴',label:'ضعيف جدا',css:'veryWeak'},dangerous:{emoji:'🚨',label:'خطر',css:'dangerous'},paid:{emoji:'✅',label:'مسدد',css:'paid'}};

let customCb=null;
window.showCustomModal=function({title,desc,showInput=false,inputValue='',placeholder='',showInput2=false,input2Value='',input2Placeholder='',confirmText='تأكيد',cancelText='إلغاء',danger=false,onConfirm}){
  document.getElementById('customTitleText').textContent=title||'تنبيه';
  document.getElementById('customDesc').textContent=desc||'';
  const i1=document.getElementById('customInput'); const i2=document.getElementById('customInput2');
  i1.style.display= showInput? 'block':'none'; i2.style.display= showInput2? 'block':'none';
  if(showInput){ i1.value=inputValue; i1.placeholder=placeholder; setTimeout(()=>i1.focus(),100); }
  if(showInput2){ i2.value=input2Value; i2.placeholder=input2Placeholder; i2.type='date'; }
  document.getElementById('customConfirm').textContent=confirmText;
  document.getElementById('customCancel').textContent=cancelText;
  document.getElementById('customConfirm').className= danger? 'm-btn danger':'m-btn confirm';
  customCb=onConfirm;
  document.getElementById('customModal').classList.add('active');
};
window.closeCustomModal=function(){ document.getElementById('customModal').classList.remove('active'); customCb=null; };
document.getElementById('customConfirm').addEventListener('click',()=>{
  const v1=document.getElementById('customInput').value; const v2=document.getElementById('customInput2').value;
  const s1=document.getElementById('customInput').style.display!=='none'; const s2=document.getElementById('customInput2').style.display!=='none';
  if(customCb) customCb(s1&&s2? {v1,v2} : s1? v1 : v2);
  closeCustomModal();
});
document.getElementById('customModal').addEventListener('click',(e)=>{ if(e.target.id==='customModal') closeCustomModal(); });

function toDateObj(s){ if(!s) return null; const d=new Date(s); if(isNaN(d)) return null; d.setHours(0,0,0,0); return d; }
function addDays(s,days){ const d=toDateObj(s); if(!d) return null; d.setDate(d.getDate()+days); return d.toISOString().split('T')[0]; }
function daysBetween(a,b){ const da=toDateObj(a), db=toDateObj(b); if(!da||!db) return null; return Math.floor((db-da)/86400000); }
function getOpsArray(ops){ let arr=Array.isArray(ops)?ops:Object.values(ops||{}); return arr.filter(o=>o).sort((a,b)=> new Date(a.date||0)-new Date(b.date||0)); }
function getAvgInterval(ops){ const rec=getOpsArray(ops).filter(o=>o.type==='received'); if(rec.length<2) return 14; let intervals=[]; for(let i=1;i<rec.length;i++){ const diff=daysBetween(rec[i-1].date, rec[i].date); if(diff && diff>0 && diff<90) intervals.push(diff); } if(intervals.length===0) return 14; intervals.sort((a,b)=>a-b); if(intervals.length>4) intervals=intervals.slice(1,-1); const avg=intervals.reduce((s,v)=>s+v,0)/intervals.length; return Math.max(3,Math.round(avg)); }
function ensureDebts(customer){
  if(customer.debts && Array.isArray(customer.debts) && customer.debts.length>0){ return customer.debts.map(d=>{ const sum=(d.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0); return {...d, remainingAmount:Math.max(0,(Number(d.originalAmount)||0)-sum)}; }); }
  let debts=[]; const base=parseFloat(customer.amount)||0;
  if(base>0){ debts.push({id:'debt_'+(customer.id||'base')+'_base', originalAmount:base, startDate:customer.date||customer.paymentDate||(customer.createdAt?customer.createdAt.split('T')[0]:new Date().toISOString().split('T')[0]), payments:[], createdAt:customer.createdAt||new Date().toISOString(), expectedDate:null}); }
  const ops=getOpsArray(customer.operations);
  ops.forEach((op,idx)=>{ if(op.type==='paid' && Number(op.amount)>0){ debts.push({id:'debt_'+(customer.id||'c')+'_paid_'+idx+'_'+Date.now(), originalAmount:Number(op.amount), startDate:op.date||customer.date, payments:[], createdAt:op.date||new Date().toISOString(), expectedDate:null}); } });
  if(debts.length===0){ debts.push({id:'debt_empty_'+Date.now(), originalAmount:0, startDate:new Date().toISOString().split('T')[0], payments:[], createdAt:new Date().toISOString()}); }
  debts.sort((a,b)=> new Date(a.startDate)-new Date(b.startDate));
  const received=ops.filter(o=>o.type==='received' && Number(o.amount)>0).sort((a,b)=> new Date(a.date)-new Date(b.date));
  received.forEach(rec=>{ let left=Number(rec.amount); for(let debt of debts){ if(left<=0) break; const paidSum=(debt.payments||[]).reduce((s,p)=>s+Number(p.amount),0); const rem=debt.originalAmount-paidSum; if(rem<=0) continue; const take=Math.min(rem,left); debt.payments.push({amount:take, date:rec.date, time:rec.time||''}); left-=take; } });
  debts.forEach(d=>{ const sum=(d.payments||[]).reduce((s,p)=>s+Number(p.amount),0); d.remainingAmount=Math.max(0,d.originalAmount-sum); });
  return debts;
}
function calcRisk(debt, avg){
  const rem=Number(debt.remainingAmount||0); if(rem<=0.5) return {level:'paid',...RISK.paid,daysLate:0,remaining:rem,expectedDate:debt.expectedDate};
  let expStr=debt.expectedDate; if(!expStr){ const lastPay=(debt.payments&&debt.payments.length>0)? debt.payments[debt.payments.length-1].date : null; const base=lastPay||debt.startDate; expStr=addDays(base, avg||14)||debt.startDate; }
  const today=new Date(); today.setHours(0,0,0,0); const exp=toDateObj(expStr); let daysLate=0; if(exp) daysLate=Math.floor((today-exp)/86400000);
  let level; if(daysLate<=0) level='good'; else if(daysLate>=1 && daysLate<=6) level='medium'; else if(daysLate>=7 && daysLate<=14) level='weak'; else if(daysLate>=15 && daysLate<=29) level='veryWeak'; else level='dangerous';
  return {level,...RISK[level],daysLate,remaining:rem,expectedDate:expStr};
}
function calculateTotal(debts){ const total=debts.reduce((s,d)=>s+Number(d.remainingAmount||0),0); document.getElementById('totalAmount').textContent=Math.round(total)+' DH'; return total; }
window.selectCityPerson=function(city){ currentCity=city; document.getElementById('cityValue').value=city; document.querySelectorAll('.city-btn').forEach(btn=>{ if(btn.dataset.city===city) btn.classList.add('active'); else btn.classList.remove('active'); }); }
function showSmartSummary(debts, avg){
  const unpaid=debts.filter(d=>d.remainingAmount>0.5); const total=debts.reduce((s,d)=>s+Number(d.remainingAmount||0),0);
  const riskCounts={good:0,medium:0,weak:0,veryWeak:0,dangerous:0,paid:0}; debts.forEach(d=>{ const r=calcRisk(d,avg); d.risk=r; riskCounts[r.level]=(riskCounts[r.level]||0)+1; });
  const worst=unpaid.length>0? unpaid.map(d=>calcRisk(d,avg)).sort((a,b)=>b.daysLate-a.daysLate)[0]:null;
  const div=document.getElementById('smartSummary');

function showDebts(debts, avg){

  const sorted=[...debts].sort((a,b)=>{ const ra=calcRisk(a,avg), rb=calcRisk(b,avg); if(a.remainingAmount<=0.5 && b.remainingAmount>0.5) return 1; if(b.remainingAmount<=0.5 && a.remainingAmount>0.5) return -1; return rb.daysLate-ra.daysLate; });

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const btn=document.getElementById('saveBtn'); btn.textContent='⏳ جاري الحفظ...'; btn.disabled=true;
  const date=document.getElementById('date').value; const paid=parseFloat(document.getElementById('paid').value)||0; const received=parseFloat(document.getElementById('received').value)||0; const city=document.getElementById('cityValue').value||currentCity||'';
  const now=new Date(); const today=now.toISOString().split('T')[0]; const currentTime=now.toTimeString().slice(0,5);
  let operations=[...customerOperations]; let debts=[...customerDebts]; debts.sort((a,b)=> new Date(a.startDate)-new Date(b.startDate)); const avgBefore=getAvgInterval(operations);
  if(paid>0){ const newDebt={id:'debt_'+Date.now(), originalAmount:paid, startDate:today, expectedDate:addDays(today,avgBefore)||today, payments:[], remainingAmount:paid, createdAt:new Date().toISOString()}; debts.push(newDebt); operations.push({type:'paid', amount:paid, date:today, time:currentTime}); }
  if(received>0){ let left=received; for(let debt of debts){ if(left<=0) break; const rem=Number(debt.remainingAmount||0); if(rem<=0.5) continue; const take=Math.min(rem,left); debt.payments=debt.payments||[]; debt.payments.push({amount:take, date:today, time:currentTime}); debt.remainingAmount=Math.max(0,rem-take); const newAvg=getAvgInterval([...operations,{type:'received', amount:received, date:today}]); debt.expectedDate=addDays(today,newAvg)||debt.expectedDate; left-=take; } operations.push({type:'received', amount:received, date:today, time:currentTime}); }
  debts.forEach(d=>{ const sum=(d.payments||[]).reduce((s,p)=>s+Number(p.amount),0); d.remainingAmount=Math.max(0,(Number(d.originalAmount)||0)-sum); });
  const updateData={date:date, paymentDate:date, city:city, operations:operations, debts:debts, paid:0, received:0, updatedAt:new Date().toISOString()};
  customerDebts=debts; customerOperations=operations;
  update(customerRef, updateData).then(()=>{ btn.textContent='✅ تم الحفظ'; document.getElementById('paid').value=''; document.getElementById('received').value=''; const avg=getAvgInterval(operations); calculateTotal(debts); showSmartSummary(debts,avg); showDebts(debts,avg); showHistory({operations:operations}); setTimeout(()=>location.reload(),700); }).catch(()=>{ btn.textContent='💾 حفظ'; btn.disabled=false; showToast('⚠️ خطأ في الحفظ'); });
});
