<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {

}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الزبون - Karni Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo','Tahoma',sans-serif}
    body{background:#f5f7fa;min-height:100vh}
 .header{background:linear-gradient(135deg, #00b894 0%, #00cec9 100%);padding:30px 20px 60px;border-radius:0 0 30px 30px;box-shadow:0 4px 20px rgba(0,184,148,0.3);position:relative}
 .header h1{color:white;font-size:28px;text-align:center;margin-bottom:10px}
 .back-btn{position:absolute;top:20px;right:20px;width:45px;height:45px;border-radius:15px;background:rgba(255,255,255,0.2);border:none;color:white;font-size:22px;cursor:pointer;backdrop-filter:blur(10px)}
 .back-btn:active{transform:scale(0.95)}
 .container{padding:20px;margin-top:-40px;position:relative;z-index:2}
 .card{background:white;border-radius:25px;padding:25px;margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,0.08);animation:slideUp 0.4s ease}
   @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
 .avatar{width:80px;height:80px;border-radius:25px;background:linear-gradient(135deg, #00b894, #00cec9);color:white;font-size:36px;font-weight:bold;display:flex;align-items:center;justify-content:center;margin:0 auto 15px}
 .name{text-align:center;font-size:24px;font-weight:bold;color:#2d3436;margin-bottom:5px}
 .phone{text-align:center;color:#636e72;font-size:16px;margin-bottom:20px}
 .total-box{background:linear-gradient(135deg, #00b894 0%, #00cec9 100%);color:white;padding:20px;border-radius:20px;text-align:center;margin-bottom:20px}
 .total-label{font-size:14px;opacity:0.9;margin-bottom:5px}
 .total-value{font-size:32px;font-weight:bold}
 .label{display:block;font-weight:bold;color:#2d3436;margin:15px 0 8px;font-size:15px}
 .input{width:100%;padding:16px;border:2px solid #dfe6e9;border-radius:15px;font-size:16px;background:#f8f9fa;transition:0.3s; font-family:'Cairo',sans-serif;}
 .input:focus{border-color:#00b894;background:white;outline:none;box-shadow:0 0 0 3px rgba(0,184,148,0.1)}
 .input[readonly]{background:#e9ecef;color:#6c757d;cursor:not-allowed}
 .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .save-btn{width:100%;padding:18px;border:none;border-radius:15px;background:linear-gradient(135deg, #00b894 0%, #00cec9 100%);color:white;font-size:18px;font-weight:bold;cursor:pointer;margin-top:25px;box-shadow:0 4px 15px rgba(0,184,148,0.3);transition:0.2s}
 .save-btn:active{transform:scale(0.97);box-shadow:0 2px 8px rgba(0,184,148,0.2)}
 .loading{text-align:center;padding:50px;color:#636e72;font-size:18px}
 .date-label{font-size:12px;color:#74b9ff;margin-top:5px;font-weight:normal}
 .paid-input{border:2px solid #ff7675!important;background:#fff5f5!important}
 .received-input{border:2px solid #00b894!important;background:#f0fff4!important}
 .history-title{font-size:18px;font-weight:bold;color:#2d3436;margin:25px 0 15px}
 .history-item{background:#f8f9fa;border-right:4px solid #00b894;padding:12px 15px;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
 .history-paid{border-right-color:#ff7675!important}
 .history-amount{font-weight:bold;font-size:16px}
 .history-paid.history-amount{color:#ff7675}
 .history-received.history-amount{color:#00b894}
 .history-date{font-size:13px;color:#636e72}
.whatsapp-btn{background:#25D366;color:white;border:none;padding:6px 10px;border-radius:8px;cursor:pointer;}
.confirm-btn{background:#2563eb;color:white;border:none;padding:6px 10px;border-radius:8px;cursor:pointer;}

 /* ========== City 3 buttons - person ========== */
 .city-quick-person{
    display:flex;gap:8px;margin-top:8px;
 }
 .city-quick-btn-person{
    flex:1;padding:12px 10px;border-radius:14px;
    font-size:14px;font-weight:800;
    border:2px solid #dfe6e9;background:#f8f9fa;
    color:#636e72;cursor:pointer;transition:0.25s;
    font-family:'Cairo',sans-serif;
 }
 .city-quick-btn-person:hover{
    border-color:#00b894;color:#00b894;transform:scale(1.02);
 }
 .city-quick-btn-person.active-city{
    background:linear-gradient(135deg,#00b894 0%, #00cec9 100%);
    color:white;border-color:transparent;
    box-shadow:0 4px 15px rgba(0,184,148,0.3);
 }
 .city-quick-btn-person:active{transform:scale(0.96);}
</style>
</head>
<body>

<div class="header">
    <button class="back-btn" id="backBtn">⬅️</button>
    <h1>📒 Karni Pro</h1>
</div>

<div class="container">
    <div id="loading" class="loading">جاري التحميل...</div>

    <div id="content" style="display:none">
        <div class="card">
            <div class="avatar" id="avatar">B</div>
            <div class="name" id="name">...</div>
            <div class="phone" id="phone">...</div>

            <div class="total-box">
                <div class="total-label">المبلغ الإجمالي</div>
                <div class="total-value" id="totalAmount">0 درهم</div>
            </div>

            <label class="label">💰 المبلغ الأساسي</label>
            <input type="number" id="amount" class="input" placeholder="0" readonly>

            <label class="label">📍 المدينة / City - اختر واحدة</label>
            <div class="city-quick-person" id="cityQuickPerson">
                <button class="city-quick-btn-person" data-city="TanTan" onclick="selectCityPerson('TanTan')">TanTan</button>
                <button class="city-quick-btn-person" data-city="Ouatia" onclick="selectCityPerson('Ouatia')">Ouatia</button>
                <button class="city-quick-btn-person" data-city="Gulmim" onclick="selectCityPerson('Gulmim')">Gulmim</button>
            </div>
            <input type="hidden" id="cityValue">

            <label class="label">📅 تاريخ الأداء</label>
            <input type="date" id="date" class="input">

            <div class="row">
                <div>
                    <label class="label">📤 استلام </label>
                    <input type="number" id="received" class="input received-input" placeholder="">
                    <div class="date-label" id="paidDate">تاريخ الدفع: --</div>
                </div>
                <div>
                    <label class="label">📥 دفع </label>
                    <input type="number" id="paid" class="input paid-input" placeholder="">
                    <div class="date-label" id="receivedDate">تاريخ الاستلام: --</div>
                </div>
            </div>

            <button class="save-btn" id="saveBtn">💾 حفظ التغييرات</button>

            <div class="history-title">📋 سجل العمليات</div>
            <div id="historyList" style="max-height:350px;overflow-y:auto;padding-left:5px;"></div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get('id');
const loading = document.getElementById('loading');
const content = document.getElementById('content');

if(!id){alert('خطأ: ما كاينش id');window.location.href = 'index.html';}
const customerRef = ref(db, 'customers/' + id);

let customerOperations = [];
let currentCity = "";

window.selectCityPerson = function(city){
    currentCity = city;
    document.getElementById('cityValue').value = city;
    document.querySelectorAll('.city-quick-btn-person').forEach(btn=>{
        if(btn.dataset.city === city) btn.classList.add('active-city');
        else btn.classList.remove('active-city');
    });
}

function calculateTotal(){
    const amount = parseFloat(document.getElementById('amount').value) || 0;
    let totalPaid = 0;
    let totalReceived = 0;
    customerOperations.forEach(op=>{
        if(op.type === 'paid') totalPaid += Number(op.amount);
        if(op.type === 'received') totalReceived += Number(op.amount);
    });
    const total = amount + totalPaid - totalReceived;
    document.getElementById('totalAmount').textContent = Math.round(total) + ' درهم';
}

function showHistory(data){
    const historyList = document.getElementById('historyList');
    historyList.innerHTML = '';
    customerOperations = data.operations || [];
    if(customerOperations.length === 0){
        historyList.innerHTML = '<div style="text-align:center;color:#999;padding:20px">لا توجد عمليات بعد</div>';
        return;
    }
    customerOperations.slice().reverse().forEach((op,index)=>{
        const div = document.createElement('div');
        div.className = 'history-item ' + (op.type === 'paid' ? 'history-paid' : 'history-received');
        div.innerHTML = `
<div>
    <div class="history-amount">${op.amount} درهم - ${op.type === 'paid' ? 'دفع' : 'استلام'}</div>
    <div class="history-date">📅 ${op.date || '--'}</div>
</div>
<div style="display:flex;gap:6px">
<button class="whatsapp-btn" onclick="sendReminderWhatsapp(${customerOperations.length-1-index})">📱</button>
<button class="confirm-btn" onclick="sendConfirmWhatsapp(${customerOperations.length-1-index})">✅</button>
<button onclick="editOperation(${customerOperations.length-1-index})">✏️</button>
<button onclick="deleteOperation(${customerOperations.length-1-index})">🗑️</button>
</div>`;
        historyList.appendChild(div);
    });
}

get(customerRef).then((snapshot)=>{
    loading.style.display = 'none';
    content.style.display = 'block';
    if(snapshot.exists()){
        const data = snapshot.val();
        const name = data.name || 'بدون اسم';
        document.getElementById('name').textContent = name;
        document.getElementById('phone').textContent = data.phone || 'لا يوجد هاتف';
        document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();
        document.getElementById('amount').value = data.amount || 0;
        document.getElementById('date').value = data.paymentDate || data.date || '';
        document.getElementById('paid').value = data.paid || '';
        document.getElementById('received').value = data.received || '';

        const city = data.city || '';
        currentCity = city;
        document.getElementById('cityValue').value = city;
        if(city){
            selectCityPerson(city);
        }

        if(data.paidDate) document.getElementById('paidDate').textContent = 'تاريخ الدفع: ' + data.paidDate;
        if(data.receivedDate) document.getElementById('receivedDate').textContent = 'تاريخ الاستلام: ' + data.receivedDate;

        customerOperations = data.operations || [];
        calculateTotal();
        showHistory(data);
    }else{
        alert('الزبون غير موجود');
        window.location.href = 'index.html';
    }
}).catch((error)=>{
    alert('خطأ: ' + error.message);
    window.location.href = 'index.html';
});

document.getElementById('paid').addEventListener('input', calculateTotal);
document.getElementById('received').addEventListener('input', calculateTotal);

document.getElementById('saveBtn').addEventListener('click', ()=>{
    const btn = document.getElementById('saveBtn');
    btn.textContent = '⏳ جاري الحفظ...';
    btn.disabled = true;

    const amount = parseFloat(document.getElementById('amount').value) || 0;
    const date = document.getElementById('date').value;
    const paid = parseFloat(document.getElementById('paid').value) || 0;
    const received = parseFloat(document.getElementById('received').value) || 0;
    const city = document.getElementById('cityValue').value || currentCity || '';

    const now = new Date();
    const today = now.toISOString().split('T')[0];
    const currentTime = now.toTimeString().slice(0,5);
    let operations = [...customerOperations];

    if(received > 0){
        operations.push({type:'received', amount: received, date: today, time: currentTime});
    }
    if(paid > 0){
        operations.push({type:'paid', amount: paid, date: today, time: currentTime});
    }

    const updateData = {
        date: date,
        paymentDate: date,
        city: city,
        operations: operations,
        paid: 0,
        received: 0,
        updatedAt: new Date().toISOString()
    };

    customerOperations = operations;
    calculateTotal();

    update(customerRef, updateData).then(()=>{
        btn.textContent = '✅ تم الحفظ';
        document.getElementById('paid').value = '';
        document.getElementById('received').value = '';
        showHistory({operations: customerOperations});
        setTimeout(()=>{ location.reload(); },800);
    }).catch((error)=>{
        alert('خطأ: ' + error.message);
        btn.textContent = '💾 حفظ التغييرات';
        btn.disabled = false;
    });
});

window.deleteOperation = function(index){
    if(!confirm('حذف العملية؟')) return;
    customerOperations.splice(index,1);
    update(customerRef,{operations: customerOperations}).then(()=>{
        calculateTotal();
        showHistory({operations: customerOperations});
    });
}

window.editOperation = function(index){
    let amount = prompt('المبلغ الجديد', customerOperations[index].amount);
    if(amount === null) return;
    let date = prompt('التاريخ الجديد', customerOperations[index].date);
    if(date === null) return;
    customerOperations[index].amount = Number(amount);
    customerOperations[index].date = date;
    update(customerRef,{operations: customerOperations}).then(()=>{
        calculateTotal();
        showHistory({operations: customerOperations});
    });
}

window.sendReminderWhatsapp = function(index){
    const phone = document.getElementById('phone').textContent.trim();
    const customerName = document.getElementById('name').textContent;
    const total = document.getElementById('totalAmount').textContent;
    if(!phone || phone === 'لا يوجد هاتف'){ alert('أضف رقم هاتف ' + customerName + ' أولاً'); return; }
    const cleanPhone = phone.replace(/\D/g,'');
    const message = `📌 إشعار أداء\n\nالسلام عليكم ${customerName}\n\n🔔 هذا تذكير بموعد أداء .\n\n💵 المبلغ المتبقي لكم:\n${total}\n\n🕕 موعد الأداء:\nبعد الساعة التاسعة مساءً.\n\n✅ المرجو توفير الدفعة في الوقت المحدد.\n\n🤝 شكراً لتعاونكم.\n\n👤 مصطفى`;
    window.open('https://wa.me/212' + cleanPhone.replace(/^0/,'') + '?text=' + encodeURIComponent(message), '_blank');
}

window.sendConfirmWhatsapp = function(index){
    const phone = document.getElementById('phone').textContent.trim();
    const customerName = document.getElementById('name').textContent;
    if(!phone || phone === 'لا يوجد هاتف'){ alert('أضف رقم هاتف ' + customerName + ' أولاً'); return; }
    const op = customerOperations[index];
    const total = document.getElementById('totalAmount').textContent;
    const cleanPhone = phone.replace(/\D/g,'');
    const message = `✅ إشعار استلام دفعة\n\nالسلام عليكم ${customerName}\n\nتم تسجيل استلام مبلغ قدره:\n\n💵 ${op.amount} درهم\n\n📌 المبلغ المتبقي الواجب أداؤه:\n${total}\n\n🙏 شكراً لكم على حسن تعاونكم.\n\n👤 مصطفى`;
    window.open('https://wa.me/212' + cleanPhone.replace(/^0/,'') + '?text=' + encodeURIComponent(message), '_blank');
}

document.getElementById('backBtn').addEventListener('click', ()=>{
    window.location.href = 'index.html';
});
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
